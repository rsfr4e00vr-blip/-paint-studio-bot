$('#gadd').onclick=async()=>{const t=document.createElement('canvas');t.width=t.height=240;t.getContext('2d').drawImage(flat(),0,0,240,240);const g=(await db('get','gal'))||[];g.unshift({th:t.toDataURL('image/jpeg',.8),p:proj()});await db('put','gal',g.slice(0,12));toast('Сохранено в галерею');gal()};gal()}
$('#save').onclick=()=>{const u=flat().toDataURL('image/png');$('#oi').src=u;$('#ov').style.display='flex';const a=document.createElement('a');a.href=u;a.download='paint-studio-'+Date.now()+'.png';try{a.click()}catch{}};
$('#ov').onclick=()=>$('#ov').style.display='none';
addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)&&e.target.type!=='range')return;const k=e.key.toLowerCase(),m=e.ctrlKey||e.metaKey;
if(m&&k==='z'){e.preventDefault();e.shiftKey?redoF():undo()}else if(m&&k==='y'){e.preventDefault();redoF()}else if(k===' '){space=true;e.preventDefault()}
else if(!m){if(k==='b')setTool(lastBr);else if(k==='e')setTool('eraser');else if(k==='g')setTool('bucket');else if(k==='i')setTool('pick');else if(k===']'||k==='['){S.size=Math.max(1,Math.min(200,S.size+(k===']'?2:-2)));syncQs();showSz()}}});
addEventListener('keyup',e=>{if(e.key===' ')space=false});
/* autosave */
const save=()=>{if(!dirty||inRoom||cur)return;dirty=false;db('put','cur',proj())};setInterval(save,12000);document.addEventListener('visibilitychange',()=>document.hidden&&save());addEventListener('pagehide',save);
/* API for multiplayer */
window.PS={onchange:null,get stroking(){return!!cur},lock(b){locked=!!b;$('#app').classList.toggle('locked',locked);if(locked)cancel()},
enterRoom(){if(inRoom)return;stash=proj();newDoc();inRoom=true},leaveRoom(){if(!inRoom)return;inRoom=false;this.lock(false);stash?load(stash):newDoc();stash=null},
clearAll(){L.forEach(l=>l.x.clearRect(0,0,W,H));hist=[];redo=[];refresh()},setRemote(u,cb){const im=new Image();im.onload=()=>{const l=L[0];l.x.clearRect(0,0,W,H);l.x.drawImage(im,0,0,W,H);cb&&cb()};im.onerror=()=>cb&&cb();im.src=u},flat(q){return flat().toDataURL('image/jpeg',q||.6)}};
newDoc();syncQs();setTool(S.tool==='pick'||S.tool==='bucket'?'pen':S.tool);setColor(S.color);fit();
db('get','cur').then(p=>{if(p&&p.layers&&p.layers.length&&!inRoom)load(p)});
})();
