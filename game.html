<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Симулятор государства</title>
<style>
:root{--bg:#0c1420;--panel:#172538;--panel2:#20344b;--line:#344b63;--txt:#edf4fb;--muted:#a9bacb;--gold:#f0bd58;--green:#55c58a;--red:#ef6d72;--blue:#69aef2}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#0b1320,#14263b);color:var(--txt);font:14px system-ui,Segoe UI,sans-serif}
header{padding:14px max(12px,calc((100% - 1250px)/2));background:#0b1320;border-bottom:1px solid var(--line)}h1{font-size:21px;margin:0 0 4px}header p{margin:0;color:var(--muted);font-size:12px}
main{max-width:1250px;margin:auto;padding:12px}.timebar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;background:#101d2c;border:1px solid var(--line);border-radius:13px;padding:10px;margin-bottom:12px}.time-now{font-weight:800;color:var(--gold);margin-right:auto}.timebar button{min-width:42px}.timebar button.active{background:var(--gold);color:#17202b;border-color:var(--gold)}.timebar select{width:auto}
.topline{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px}.stat,.panel,.tabbar{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:11px}.stat small{display:block;color:var(--muted)}.stat b{font-size:18px}
.tabbar{display:flex;gap:6px;overflow:auto;margin-bottom:12px;padding:7px}.tabbar button{white-space:nowrap}button,select,input,textarea{font:inherit}button{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:9px 11px;border-radius:9px;cursor:pointer}button:hover{border-color:var(--gold)}button.primary{background:#806027;border-color:#c3943e}button.danger{background:#612e38;border-color:#a64b58}button.good{background:#245640;border-color:#39835f}button:disabled{opacity:.4}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.wide{grid-column:1/-1}.panel h2{font-size:16px;margin:0 0 10px}.muted,label{color:var(--muted)}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:7px 0}label{font-size:13px}input,select,textarea{background:#0f1b2a;border:1px solid var(--line);color:var(--txt);padding:9px;border-radius:8px;max-width:100%}input[type=range]{padding:0;accent-color:var(--gold)}.bar{height:8px;background:#0d1723;border-radius:20px;overflow:hidden;margin:5px 0 9px}.bar i{display:block;height:100%;background:var(--green)}.meter{min-width:120px;flex:1}.meter b{font-size:13px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted)}.pill{display:inline-block;padding:3px 8px;border:1px solid var(--line);border-radius:20px;color:var(--muted);font-size:12px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}.mini{background:#122033;border:1px solid var(--line);border-radius:10px;padding:10px}.mini b{display:block;margin-bottom:5px}.log{max-height:260px;overflow:auto;font-size:13px;color:var(--muted)}.log div{padding:6px 0;border-bottom:1px solid #34496066}.notice{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#263c52;border:1px solid var(--blue);padding:10px 16px;border-radius:10px;display:none;z-index:10;max-width:90vw}.hidden{display:none!important}.choice{padding:9px;border-bottom:1px solid var(--line)}.choice:last-child{border:0}.actions button{margin:3px}
@media(max-width:760px){.topline{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.wide{grid-column:auto}main{padding:8px}.stat b{font-size:16px}.time-now{width:100%}.timebar button{flex:1}.tabbar button{padding:9px}.panel{padding:10px}}

/* Обновлённый интерфейс */
:root{--accent:#e7b95e}header{position:sticky;top:0;z-index:5}main{padding-bottom:28px}.tabbar{position:sticky;top:58px;z-index:4;scrollbar-width:thin;background:#101d2cf2;backdrop-filter:blur(10px)}.tabbar button{font-weight:650}.tabbar button.active{background:#e7b95e;color:#17202b;border-color:#e7b95e}.panel{box-shadow:0 8px 24px #0002}.stat{background:linear-gradient(145deg,#1b3047,#142438)}.stat b{display:block;margin-top:4px}.chart-wrap{position:relative;width:100%;height:230px;background:#0e1a29;border:1px solid var(--line);border-radius:12px;padding:8px}.chart-wrap canvas{width:100%;height:100%;display:block}.party-card{border-left:3px solid var(--gold)}.gameover{position:fixed;inset:0;background:#07111eeF;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}.gameover-box{max-width:480px;width:100%;background:#172538;border:1px solid #a64b58;border-radius:18px;padding:24px;text-align:center;box-shadow:0 20px 80px #0008}.gameover-box h2{font-size:26px;color:#ff8585}.gameover-box p{color:var(--muted);line-height:1.6}.action-note{font-size:12px;color:var(--muted)}
@media(max-width:760px){header{padding:12px}header h1{font-size:18px}.tabbar{top:54px;margin-left:-2px;margin-right:-2px;border-radius:10px}.tabbar button{font-size:12px;padding:9px 10px}.chart-wrap{height:210px}.timebar{position:relative}.timebar button{min-width:0}}
button{min-height:38px;cursor:pointer}header{background:linear-gradient(90deg,#0b1320,#1a3350)}.mini{transition:.15s}.mini:hover{border-color:var(--gold);transform:translateY(-1px)}.tabbar button.active{box-shadow:0 0 0 2px #0006 inset}</style></head><body>
<header><h1>🏛️ Симулятор государства</h1><p id="subtitle">Управляйте страной без ограничения срока правления</p></header>
<main>
<section class="timebar"><div class="time-now" id="clock">Год 1 · Январь</div><button id="play" class="good">▶ Играть</button><button id="pause">⏸ Пауза</button><button id="stop" class="danger">⏹ Стоп</button><button id="step" class="primary">+ 1 месяц</button><label>Скорость</label><select id="speed"><option value="3000">0.5×</option><option value="1800" selected>1×</option><option value="900">2×</option><option value="400">5×</option><option value="150">10×</option><option value="50">30×</option></select><span class="pill" id="runstate">Пауза</span></section>
<div class="topline" id="stats"></div>
<div class="tabbar" id="tabs"><button data-tab="overview">🏠 Обзор</button><button data-tab="economy">💰 Экономика</button><button data-tab="charts">📈 Графики</button><button data-tab="military">Армия</button><button data-tab="politics">Политика</button><button data-tab="regions">Регионы</button><button data-tab="diplomacy">Дипломатия</button><button data-tab="finance">🏦 Финансы</button><button data-tab="power">🗳 Власть</button><button data-tab="people">👥 Люди</button><button data-tab="deputies">🏛 Депутаты</button><button data-tab="arms">💣 Арсенал</button><button data-tab="comeback">🔙 Возврат</button><button data-tab="documents">Документы</button><button data-tab="events">События</button><button data-tab="settings">⚙ Настройки</button></div>
<div id="content"></div></main><div class="notice" id="notice"></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v)), fmt=n=>Math.round(n).toLocaleString('ru-RU'), months=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const initial=()=>({name:'Республика Новария',month:0,year:1,money:18000,debt:0,pop:8200000,gdp:42000,inflation:5,employment:94,stability:68,approval:61,legitimacy:70,food:78,fuel:65,steel:55,equipment:48,ammo:62,energy:72,tech:32,army:42000,navy:8,air:45,training:58,morale:65,threat:20,war:false,gov:'Парламентская республика',leader:'Александр Ветров',party:'Центристский союз',playerParty:'Центристский союз',campaignOver:false,difficulty:'normal',history:[],tax:20,health:12,education:12,defense:15,industry:50,election:24,coupRisk:12,regions:[{name:'Столица',pop:1200000,wealth:82,loyalty:76,unrest:10,industry:70,infra:88,resource:'Услуги'},{name:'Северный край',pop:1600000,wealth:55,loyalty:64,unrest:18,industry:48,infra:55,resource:'Лес'},{name:'Восточная область',pop:2100000,wealth:48,loyalty:57,unrest:24,industry:75,infra:49,resource:'Сталь'},{name:'Южная провинция',pop:1900000,wealth:51,loyalty:60,unrest:20,industry:42,infra:53,resource:'Зерно'},{name:'Западный округ',pop:1400000,wealth:62,loyalty:68,unrest:14,industry:58,infra:67,resource:'Энергия'}],parties:[{name:'Центристский союз',support:34,seats:38,ideology:'Центр'},{name:'Народная партия',support:25,seats:27,ideology:'Консерватизм'},{name:'Партия реформ',support:21,seats:22,ideology:'Либерализм'},{name:'Социальный альянс',support:20,seats:13,ideology:'Социал-демократия'}],relations:[{name:'Аркания',value:15,power:65},{name:'Белория',value:48,power:42},{name:'Тарвия',value:-20,power:80}],log:['Правительство сформировано. Начинается управление государством.'],documents:[],events:[],laws:[],event:null});
let S;try{S={...initial(),...JSON.parse(localStorage.getItem('novariaSave')||'{}')}}catch{S=initial()}if(!Array.isArray(S.regions)||!Array.isArray(S.parties)||!Array.isArray(S.relations))S=initial();
if(!S.playerParty)S.playerParty=S.party||'Центристский союз';if(!S.difficulty)S.difficulty='normal';if(typeof S.campaignOver!=='boolean')S.campaignOver=false;if(!Array.isArray(S.history))S.history=[];if(!Array.isArray(S.log))S.log=[];if(!Array.isArray(S.documents))S.documents=[];if(!Array.isArray(S.laws))S.laws=[];if(!S.event)S.event=null;if(S.history.length===0){let mp=S.parties.find(p=>p.name===S.playerParty);S.history.push(snap())}
let tab='overview',timer=null,running=false,selectedDifficulty=S.difficulty;
const DIFFICULTIES={story:{label:'Сюжетная',income:1.3,expenses:.85,playerDrift:1.25,rivalPressure:.72,unrest:.7,approval:1.25,coup:.65},easy:{label:'Лёгкая',income:1.15,expenses:.93,playerDrift:1.1,rivalPressure:.88,unrest:.85,approval:1.1,coup:.85},normal:{label:'Нормальная',income:1,expenses:1,playerDrift:1,rivalPressure:1,unrest:1,approval:1,coup:1},hard:{label:'Сложная',income:.9,expenses:1.1,playerDrift:.9,rivalPressure:1.18,unrest:1.2,approval:.85,coup:1.2},expert:{label:'Эксперт',income:.78,expenses:1.22,playerDrift:.78,rivalPressure:1.42,unrest:1.45,approval:.72,coup:1.5}};
function difficulty(){return DIFFICULTIES[S.difficulty]||DIFFICULTIES.normal}
window.setDifficulty=v=>{selectedDifficulty=DIFFICULTIES[v]?v:'normal';toast('Для применения сложности начни новую кампанию')};
function save(){try{localStorage.setItem('novariaSave',JSON.stringify(S))}catch(e){toast('Не удалось сохранить: память устройства заполнена')}}
function toast(t){let n=$('#notice');n.textContent=t;n.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>n.style.display='none',2400)}
function log(t){S.log.unshift(`Год ${S.year}, ${months[S.month]}: ${t}`);S.log=S.log.slice(0,100)}
