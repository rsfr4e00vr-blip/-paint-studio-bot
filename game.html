<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симулятор Страны PRO</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #eef2f5; color: #333; margin: 0; padding: 15px; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px; }
        h3 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 5px; }
        .btn { display: block; width: 100%; background: #3498db; color: white; border: none; padding: 12px; margin: 8px 0; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; box-sizing: border-box; }
        .btn-danger { background: #e74c3c; }
        .btn-success { background: #2ecc71; }
        .bar-container { width: 100%; background: #ddd; border-radius: 6px; margin: 5px 0 15px 0; }
        .bar { height: 12px; background: #2ecc71; border-radius: 6px; width: 50%; transition: width 0.3s; }
        .flex { display: flex; justify-content: space-between; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Раздел Главных ресурсов -->
    <div class="card">
        <h3>👑 Резиденция Правителя</h3>
        <p>🏛️ Здание: <strong id="palace-name">Загрузка...</strong></p>
        <div class="flex">
            <span>💰 Казна: <span id="money-val">0</span>$</span>
            <span>📦 Резервы: <span id="stock-val">0</span> ед.</span>
        </div>
    </div>

    <!-- Статус-бары показателей страны -->
    <div class="card">
        <h3>📊 Показатели государства</h3>
        <p>📈 Стабильность системы:</p>
        <div class="bar-container"><div id="stability-bar" class="bar"></div></div>
        <p>👥 Одобрение населения:</p>
        <div class="bar-container"><div id="approval-bar" class="bar"></div></div>
    </div>

    <!-- Влияние фракций -->
    <div class="card">
        <h3>⚔️ Лояльность фракций</h3>
        <div id="factions-container"></div>
    </div>

    <!-- Пульт Черного Рынка и Шпионажа -->
    <div class="card" style="background: #fdfefe; border: 1px solid #d6dbdf;">
        <h3>⚖️ Секретные Службы и Рынок</h3>
        <button class="btn btn-success" onclick="makeMarketAction('sell')">💰 Продать резерв (+800$)</button>
        <button class="btn btn-danger" onclick="makeMarketAction('print')">🖨️ Печатный станок (+2000$, -20% Стаб.)</button>
        <button class="btn" style="background: #9b59b6;" onclick="makeSpyAction('steal')">🕵️ Украсть золото (Шанс 60%)</button>
        <button class="btn" style="background: #f1c40f; color: #333;" onclick="makeSpyAction('propaganda')">📣 Пропаганда (Шанс 80%)</button>
    </div>

    <!-- Парламент и Реформы -->
    <div class="card">
        <h3>📜 Подписание Указов</h3>
        <button class="btn" onclick="upgradePalace()">🏰 Улучшить Дворец</button>
        <button class="btn" onclick="adoptLaw('press')">📝 Свобода прессы (-1500$)</button>
        <button class="btn" onclick="adoptLaw('tax')">🪖 Военный налог (-1000$)</button>
        <button class="btn" onclick="adoptLaw('money')">💵 Субсидии рабочим (-2500$)</button>
        <button class="btn" onclick="adoptLaw('censorship')">👁️ Тотальная цензура (-2000$)</button>
    </div>

    <!-- Смена хода -->
    <button class="btn btn-danger" style="font-size: 18px; padding: 15px;" onclick="nextTurn()">🎲 ЗАВЕРШИТЬ ХОД</button>

    <!-- Скрипты логики -->
    <script src="extras.js"></script>
</body>
</html>
