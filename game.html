<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Симулятор государства</title>
<style>
:root{--bg:#0c1420;--panel:#172538;--panel2:#20344b;--line:#344b63;--txt:#edf4fb;--muted:#a9bacb;--gold:#f0bd58;--green:#55c58a;--red:#ef6d72;--blue:#69aef2}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#0b1320,#14263b);color:var(--txt);font:14px system-ui,Segoe UI,sans-serif}
header{padding:14px max(12px,calc((100% - 1250px)/2));background:#0b1320;border-bottom:1px solid var(--line)}h1{font-size:21px;margin:0 0 4px}header p{margin:0;color:var(--muted);font-size:12px}
main{max-width:1250px;margin:auto;padding:12px}.timebar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;background:#101d2c;border:1px solid var(--line);border-radius:13px;padding:10px;margin-bottom:12px}.time-now{font-weight:800;color:var(--gold);margin-right:auto}.timebar button{min-width:42px}.timebar button.active{background:var(--gold);color:#17202b;border-color:var(--gold)}.timebar select{width:auto}
.topline{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px}.stat,.panel,.tabbar{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:11px}.stat small{display:block;color:var(--muted)}.stat b{font-size:18px}
.tabbar{display:flex;gap:6px;overflow:auto;margin-bottom:12px;padding:7px}.tabbar button{white-space:nowrap}button,select,input,textarea{font:inherit}button{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:9px 11px;border-radius:9px;cursor:pointer}button:hover{border-color:var(--gold)}button.primary{background:#806027;border-color:#c3943e}button.danger{background:#612e38;border-color:#a64b58}button.good{background:#245640;border-color:#39835f}button:disabled{opacity:.4}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.wide{grid-column:1/-1}.panel h2{font-size:16px;margin:0 0 10px}.muted,label{color:var(--muted)}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:7px 0}label{font-size:13px}input,select,textarea{background:#0f1b2a;border:1px solid var(--line);color:var(--txt);padding:9px;border-radius:8px;max-width:100%}input[type=range]{padding:0;accent-color:var(--gold)}.bar{height:8px;background:#0d1723;border-radius:20px;overflow:hidden;margin:5px 0 9px}.bar i{display:block;height:100%;background:var(--green)}.meter{min-width:120px;flex:1}.meter b{font-size:13px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted)}.pill{display:inline-block;padding:3px 8px;border:1px solid var(--line);border-radius:20px;color:var(--muted);font-size:12px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}.mini{background:#122033;border:1px solid var(--line);border-radius:10px;padding:10px}.mini b{display:block;margin-bottom:5px}.log{max-height:260px;overflow:auto;font-size:13px;color:var(--muted)}.log div{padding:6px 0;border-bottom:1px solid #34496066}.notice{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#263c52;border:1px solid var(--blue);padding:10px 16px;border-radius:10px;display:none;z-index:10;max-width:90vw}.hidden{display:none!important}.choice{padding:9px;border-bottom:1px solid var(--line)}.choice:last-child{border:0}.actions button{margin:3px}
@media(max-width:760px){.topline{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.wide{grid-column:auto}main{padding:8px}.stat b{font-size:16px}.time-now{width:100%}.timebar button{flex:1}.tabbar button{padding:9px}.panel{padding:10px}}

/* Обновлённый интерфейс */
:root{--accent:#e7b95e}header{position:sticky;top:0;z-index:5}main{padding-bottom:28px}.tabbar{position:sticky;top:58px;z-index:4;scrollbar-width:thin;background:#101d2cf2;backdrop-filter:blur(10px)}.tabbar button{font-weight:650}.tabbar button.active{background:#e7b95e;color:#17202b;border-color:#e7b95e}.panel{box-shadow:0 8px 24px #0002}.stat{background:linear-gradient(145deg,#1b3047,#142438)}.stat b{display:block;margin-top:4px}.chart-wrap{position:relative;width:100%;height:230px;background:#0e1a29;border:1px solid var(--line);border-radius:12px;padding:8px}.chart-wrap canvas{width:100%;height:100%;display:block}.party-card{border-left:3px solid var(--gold)}.gameover{position:fixed;inset:0;background:#07111eeF;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}.gameover-box{max-width:480px;width:100%;background:#172538;border:1px solid #a64b58;border-radius:18px;padding:24px;text-align:center;box-shadow:0 20px 80px #0008}.gameover-box h2{font-size:26px;color:#ff8585}.gameover-box p{color:var(--muted);line-height:1.6}.action-note{font-size:12px;color:var(--muted)}
@media(max-width:760px){header{padding:12px}header h1{font-size:18px}.tabbar{top:54px;margin-left:-2px;margin-right:-2px;border-radius:10px}.tabbar button{font-size:12px;padding:9px 10px}.chart-wrap{height:210px}.timebar{position:relative}.timebar button{min-width:0}}
</style></head><body>
<header><h1>🏛️ Симулятор государства</h1><p id="subtitle">Управляйте страной без ограничения срока правления</p></header>
<main>
<section class="timebar"><div class="time-now" id="clock">Год 1 · Январь</div><button id="play" class="good">▶ Играть</button><button id="pause">⏸ Пауза</button><button id="stop" class="danger">⏹ Стоп</button><button id="step" class="primary">+ 1 месяц</button><label>Скорость</label><select id="speed"><option value="3000">0.5×</option><option value="1800" selected>1×</option><option value="900">2×</option><option value="400">5×</option><option value="150">10×</option><option value="50">30×</option></select><span class="pill" id="runstate">Пауза</span></section>
<div class="topline" id="stats"></div>
<div class="tabbar" id="tabs"><button data-tab="overview">🏠 Обзор</button><button data-tab="economy">💰 Экономика</button><button data-tab="charts">📈 Графики</button><button data-tab="military">Армия</button><button data-tab="politics">Политика</button><button data-tab="regions">Регионы</button><button data-tab="diplomacy">Дипломатия</button><button data-tab="documents">Документы</button><button data-tab="events">События</button><button data-tab="settings">⚙ Настройки</button></div>
<div id="content"></div></main><div class="notice" id="notice"></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v)), fmt=n=>Math.round(n).toLocaleString('ru-RU'), months=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const initial=()=>({name:'Республика Новария',month:0,year:1,money:18000,debt:0,pop:8200000,gdp:42000,inflation:5,employment:94,stability:68,approval:61,legitimacy:70,food:78,fuel:65,steel:55,equipment:48,ammo:62,energy:72,tech:32,army:42000,navy:8,air:45,training:58,morale:65,threat:20,war:false,gov:'Парламентская республика',leader:'Александр Ветров',party:'Центристский союз',playerParty:'Центристский союз',campaignOver:false,difficulty:'normal',history:[],tax:20,health:12,education:12,defense:15,industry:50,election:24,coupRisk:12,regions:[{name:'Столица',pop:1200000,wealth:82,loyalty:76,unrest:10,industry:70,infra:88,resource:'Услуги'},{name:'Северный край',pop:1600000,wealth:55,loyalty:64,unrest:18,industry:48,infra:55,resource:'Лес'},{name:'Восточная область',pop:2100000,wealth:48,loyalty:57,unrest:24,industry:75,infra:49,resource:'Сталь'},{name:'Южная провинция',pop:1900000,wealth:51,loyalty:60,unrest:20,industry:42,infra:53,resource:'Зерно'},{name:'Западный округ',pop:1400000,wealth:62,loyalty:68,unrest:14,industry:58,infra:67,resource:'Энергия'}],parties:[{name:'Центристский союз',support:34,seats:38,ideology:'Центр'},{name:'Народная партия',support:25,seats:27,ideology:'Консерватизм'},{name:'Партия реформ',support:21,seats:22,ideology:'Либерализм'},{name:'Социальный альянс',support:20,seats:13,ideology:'Социал-демократия'}],relations:[{name:'Аркания',value:15,power:65},{name:'Белория',value:48,power:42},{name:'Тарвия',value:-20,power:80}],log:['Правительство сформировано. Начинается управление государством.'],documents:[],events:[],laws:[],event:null});
let S;try{S={...initial(),...JSON.parse(localStorage.getItem('novariaSave')||'{}')}}catch{S=initial()}if(!Array.isArray(S.regions)||!Array.isArray(S.parties)||!Array.isArray(S.relations))S=initial();
if(!S.playerParty)S.playerParty=S.party||'Центристский союз';if(!S.difficulty)S.difficulty='normal';if(typeof S.campaignOver!=='boolean')S.campaignOver=false;if(!Array.isArray(S.history))S.history=[];if(!Array.isArray(S.log))S.log=[];if(!Array.isArray(S.documents))S.documents=[];if(!Array.isArray(S.laws))S.laws=[];if(!S.event)S.event=null;if(S.history.length===0){let mp=S.parties.find(p=>p.name===S.playerParty);S.history.push({year:S.year,month:S.month,gdp:S.gdp,money:S.money,debt:S.debt,approval:S.approval,stability:S.stability,partySupport:mp?mp.support:0,pop:S.pop,food:S.food,fuel:S.fuel})}
let tab='overview',timer=null,running=false,selectedDifficulty=S.difficulty;
const DIFFICULTIES={story:{label:'Сюжетная',income:1.3,expenses:.85,playerDrift:1.25,rivalPressure:.72,unrest:.7,approval:1.25,coup:.65},easy:{label:'Лёгкая',income:1.15,expenses:.93,playerDrift:1.1,rivalPressure:.88,unrest:.85,approval:1.1,coup:.85},normal:{label:'Нормальная',income:1,expenses:1,playerDrift:1,rivalPressure:1,unrest:1,approval:1,coup:1},hard:{label:'Сложная',income:.9,expenses:1.1,playerDrift:.9,rivalPressure:1.18,unrest:1.2,approval:.85,coup:1.2},expert:{label:'Эксперт',income:.78,expenses:1.22,playerDrift:.78,rivalPressure:1.42,unrest:1.45,approval:.72,coup:1.5}};
function difficulty(){return DIFFICULTIES[S.difficulty]||DIFFICULTIES.normal}
window.setDifficulty=v=>{selectedDifficulty=DIFFICULTIES[v]?v:'normal';toast('Для применения сложности начни новую кампанию')};
function save(){try{localStorage.setItem('novariaSave',JSON.stringify(S))}catch(e){toast('Не удалось сохранить: память устройства заполнена')}}
function toast(t){let n=$('#notice');n.textContent=t;n.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>n.style.display='none',2400)}
function log(t){S.log.unshift(`Год ${S.year}, ${months[S.month]}: ${t}`);S.log=S.log.slice(0,100)}
function bar(label,val){return `<div class="meter"><b>${label}: ${fmt(val)}%</b><div class="bar"><i style="width:${clamp(val)}%"></i></div></div>`}
function stats(){let a=[['Казна',fmt(S.money)+' млн'],['ВВП',fmt(S.gdp)+' млрд'],['Население',fmt(S.pop)],['Стабильность',S.stability+'%'],['Одобрение',S.approval+'%'],['Армия',fmt(S.army)]];$('#stats').innerHTML=a.map(x=>`<div class="stat"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('');$('#clock').textContent=`${S.year} год · ${months[S.month]}`;$('#runstate').textContent=running?'Идёт время':'Пауза';$('#play').classList.toggle('active',running)}
function card(title,body){return `<section class="panel"><h2>${title}</h2>${body}</section>`}
function render(){stats();let c='';
if(tab==='overview')c=`<div class="grid">${card('Государство',`<div class="cards"><div class="mini"><b>${S.name}</b>Форма правления: ${S.gov}<br>Лидер: ${S.leader}<br>Партия: ${S.party}<br>Сложность: <b>${difficulty().label}</b></div><div class="mini"><b>Состояние страны</b>${bar('Стабильность',S.stability)}${bar('Одобрение',S.approval)}${bar('Легитимность',S.legitimacy)}</div></div>`)}${card('Национальные ресурсы',`<div class="cards">${[['Продовольствие',S.food],['Топливо',S.fuel],['Сталь',S.steel],['Вооружение',S.equipment],['Боеприпасы',S.ammo],['Энергия',S.energy],['Технологии',S.tech]].map(x=>`<div class="mini"><b>${x[0]}</b>${x[1]} / 100<div class="bar"><i style="width:${clamp(x[1])}%"></i></div></div>`).join('')}</div>`)}${card('Последние события',`<div class="log">${S.log.slice(0,9).map(x=>`<div>${x}</div>`).join('')}</div>`)}${card('Быстрые действия',`<div class="actions"><button onclick="act('roads')">Построить дороги (500 млн)</button><button onclick="act('aid')">Помощь населению (300 млн)</button><button onclick="act('reform')">Государственная реформа (700 млн)</button></div>`)}</div>`;
if(tab==='economy')c=`<div class="grid">${card('Экономика',`<div class="cards"><div class="mini">Доходы в месяц <b>${fmt(income())} млн</b></div><div class="mini">Расходы в месяц <b>${fmt(expenses())} млн</b></div><div class="mini">Государственный долг <b>${fmt(S.debt)} млн</b></div><div class="mini">Инфляция <b>${S.inflation}%</b></div></div>${bar('Занятость',S.employment)}<div class="row"><button onclick="act('industry')">Развивать промышленность · 800 млн</button><button onclick="act('trade')">Торговое соглашение · 200 млн</button><button onclick="act('debt')">Погасить 1000 млн долга</button></div>`)}${card('Бюджетные настройки',`<div class="row"><label>Налоговая ставка <b id="taxv">${S.tax}%</b></label><input type="range" min="5" max="50" value="${S.tax}" oninput="setv('tax',this.value,'taxv','%')"></div><div class="row"><label>Здравоохранение <b id="healthv">${S.health}%</b></label><input type="range" min="0" max="35" value="${S.health}" oninput="setv('health',this.value,'healthv','%')"></div><div class="row"><label>Образование <b id="educationv">${S.education}%</b></label><input type="range" min="0" max="35" value="${S.education}" oninput="setv('education',this.value,'educationv','%')"></div><div class="row"><label>Оборона <b id="defensev">${S.defense}%</b></label><input type="range" min="0" max="45" value="${S.defense}" oninput="setv('defense',this.value,'defensev','%')"></div><button class="primary" onclick="saveBudget()">Применить бюджет</button>`)}</div>`;
if(tab==='military')c=`<div class="grid">${card('Вооружённые силы',`<div class="cards">${[['Сухопутные войска',fmt(S.army)+' чел.'],['Флот',S.navy+' кораблей'],['Авиация',S.air+' эскадрилий'],['Подготовка',S.training+'%'],['Боевой дух',S.morale+'%'],['Военная угроза',S.threat+'%']].map(x=>`<div class="mini">${x[0]}<b>${x[1]}</b></div>`).join('')}</div>${bar('Боевой дух',S.morale)}<div class="actions"><button onclick="act('recruit')">Набрать 5 000 солдат · 400 млн</button><button onclick="act('train')">Военные учения · 250 млн</button><button onclick="act('equipment')">Закупить вооружение · 500 млн</button><button onclick="act('mobilize')">Мобилизация</button><button class="danger" onclick="act('demobilize')">Сократить армию</button></div><p>Состояние: <b>${S.war?'ВОЙНА':'Мирное время'}</b></p><button class="${S.war?'good':'danger'}" onclick="act('war')">${S.war?'Заключить перемирие':'Объявить чрезвычайное военное положение'}</button>`)}${card('Военные запасы',`<div class="cards">${[['Топливо',S.fuel],['Сталь',S.steel],['Вооружение',S.equipment],['Боеприпасы',S.ammo]].map(x=>`<div class="mini">${x[0]} <b>${x[1]}/100</b></div>`).join('')}</div>`)}</div>`;
if(tab==='politics')c=`<div class="grid">${card('Твоя партия',`<div class="mini party-card"><b>🎖 ${S.playerParty}</b>Ты играешь за эту партию. Если она проиграет выборы и потеряет власть — кампания будет проиграна.</div><p>Правящая партия: <b>${S.party}</b></p><p>Глава правительства: <b>${S.leader}</b></p><p>До выборов: <b>${S.election} мес.</b></p><div class="actions"><button class="good" onclick="campaignAction('rally')">Провести митинг · 250 млн</button><button onclick="campaignAction('program')">Опубликовать программу · 400 млн</button><button onclick="act('speech')">Обращение к нации</button><button onclick="act('law')">Принять социальный закон</button><button class="primary" onclick="act('election')">Провести досрочные выборы</button><button onclick="act('security')">Усилить охрану правительства</button></div>${bar('Одобрение правительства',S.approval)}${bar('Риск переворота',S.coupRisk)}</div>`)}${card('Политические партии и парламент',`<div class="cards">${S.parties.slice().sort((a,b)=>b.support-a.support).map(p=>`<div class="mini ${p.name===S.playerParty?'party-card':''}"><b>${p.name} ${p.name===S.playerParty?'★ ТВОЯ ПАРТИЯ':''}</b>${p.ideology}<br>Поддержка: <b>${Math.round(p.support)}%</b> · Мест: ${p.seats}<div class="bar"><i style="width:${clamp(p.support)}%"></i></div></div>`).join('')}</div><p class="action-note">Рейтинг партий меняется каждый месяц в зависимости от экономики, стабильности и решений правительства.</p>`)}</div>`;
if(tab==='charts')c=`<div class="grid">${card('Экономика: рост и падение',`<div class="chart-wrap"><canvas id="chartEconomy"></canvas></div><p class="action-note">ВВП, казна и государственный долг. История последних 60 месяцев.</p>`)}${card('Политика и общество',`<div class="chart-wrap"><canvas id="chartPolitics"></canvas></div><p class="action-note">Поддержка твоей партии, одобрение правительства и стабильность.</p>`)}${card('Население и ресурсы',`<div class="chart-wrap"><canvas id="chartPopulation"></canvas></div><p class="action-note">Население, продовольствие и топливо.</p>`)}</div>`;
if(tab==='regions')c=`<div class="cards">${S.regions.map((r,i)=>`<div class="mini"><b>${r.name}</b>Население: ${fmt(r.pop)}<br>Благосостояние: ${r.wealth}%<br>Лояльность: ${r.loyalty}%<br>Недовольство: ${r.unrest}%<br>Промышленность: ${r.industry}%<br>Инфраструктура: ${r.infra}%<br>Ресурс: ${r.resource}<div class="actions"><button onclick="regionAct(${i},'invest')">Инвестиции · 250 млн</button><button onclick="regionAct(${i},'aid')">Помощь · 100 млн</button><button onclick="regionAct(${i},'police')">Порядок</button></div></div>`).join('')}</div>`;
if(tab==='diplomacy')c=`<div class="cards">${S.relations.map((r,i)=>`<div class="mini"><b>${r.name}</b>Отношения: ${r.value}<div class="bar"><i style="width:${clamp((r.value+100)/2)}%"></i></div>Военная мощь: ${r.power}<div class="actions"><button onclick="diplomacy(${i},'talk')">Переговоры · 100 млн</button><button onclick="diplomacy(${i},'trade')">Торговля · 250 млн</button><button onclick="diplomacy(${i},'sanction')">Санкции</button></div></div>`).join('')}</div>`;
if(tab==='documents')c=`<div class="grid">${card('Государственные документы',`<div class="row"><input id="docname" placeholder="Название документа"><select id="doctype"><option>Указ</option><option>Закон</option><option>Бюджет</option><option>Военный приказ</option><option>Дипломатическая нота</option></select></div><textarea id="doctext" rows="5" style="width:100%" placeholder="Текст документа..."></textarea><button class="primary" onclick="createDoc()">Подписать и сохранить</button>`)}${card('Архив документов',S.documents.length?S.documents.map((d,i)=>`<div class="choice"><b>${d.type}: ${d.name}</b><small class="muted"> · ${d.date}</small><p>${d.text}</p><button onclick="deleteDoc(${i})">Удалить</button></div>`).join(''):'Пока документов нет.')}</div>`;
if(tab==='events')c=`<div class="grid">${card('События государства',S.event?`<h3>${S.event.title}</h3><p>${S.event.text}</p><div class="actions"><button class="primary" onclick="resolveEvent(0)">${S.event.a}</button><button onclick="resolveEvent(1)">${S.event.b}</button></div>`:'<p>Сейчас нет неразрешённых событий.</p>')}${card('Хроника',`<div class="log">${S.log.map(x=>`<div>${x}</div>`).join('')}</div>`)}</div>`;
if(tab==='settings')c=`<div class="grid">${card('Сложность кампании',`<p>Выбери, насколько трудно удерживать власть и развивать государство. Сложность применяется только к <b>новой кампании</b>, текущую игру она не меняет.</p><div class="row"><label for="difficultySelect">Уровень сложности</label><select id="difficultySelect" onchange="setDifficulty(this.value)"><option value="story" ${selectedDifficulty==='story'?'selected':''}>История — очень легко</option><option value="easy" ${selectedDifficulty==='easy'?'selected':''}>Лёгкая</option><option value="normal" ${selectedDifficulty==='normal'?'selected':''}>Нормальная</option><option value="hard" ${selectedDifficulty==='hard'?'selected':''}>Сложная</option><option value="expert" ${selectedDifficulty==='expert'?'selected':''}>Эксперт</option></select></div><div class="mini"><b>Текущая сложность: ${difficulty().label}</b><br>Доходы ×${difficulty().income.toFixed(2)} · расходы ×${difficulty().expenses.toFixed(2)}<br>Давление оппозиции ×${difficulty().rivalPressure.toFixed(2)}<br>Риск беспорядков ×${difficulty().unrest.toFixed(2)}</div><button class="primary" onclick="resetGame()">Начать новую кампанию на выбранной сложности</button>`)}${card('Сохранение',`<p>Прогресс автоматически сохраняется на этом устройстве.</p><button class="good" onclick="save();toast('Игра сохранена')">Сохранить сейчас</button> <button onclick="exportSave()">Экспортировать сохранение</button><div class="row"><input type="file" id="importfile" accept=".json"><button onclick="importSave()">Загрузить файл</button></div>`)}${card('Параметры страны',`<div class="row"><label>Название</label><input id="countryname" value="${S.name}"><button onclick="S.name=$('#countryname').value;save();render()">Изменить</button></div>`)}</div>`;
$('#content').innerHTML=c;$('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));drawCharts();if(S.campaignOver)showGameOver()}
function runElection(){
 if(S.campaignOver)return;
 let total=S.parties.reduce((a,p)=>a+Math.max(1,p.support),0);
 S.parties.forEach(p=>p.support=Math.round(p.support/total*1000)/10);
 let seats=120,used=0;S.parties.forEach((p,i)=>{p.seats=i===S.parties.length-1?seats-used:Math.floor(p.support/100*seats);used+=p.seats});
 let winner=S.parties.slice().sort((a,b)=>b.support-a.support)[0];
 S.election=36;S.party=winner.name;
 if(winner.name===S.playerParty){S.approval=clamp(S.approval+5);S.legitimacy=clamp(S.legitimacy+7);S.leader='Александр Ветров';log(`Выборы выиграны! Партия «${winner.name}» сохраняет власть (${winner.support}% голосов).`);toast('ПОБЕДА! Твоя партия сохранила власть.');}
 else{S.campaignOver=true;running=false;clearInterval(timer);timer=null;S.leader='Новое правительство';log(`Поражение на выборах. Партия «${winner.name}» победила с ${winner.support}% голосов. Твоя партия потеряла власть.`);}
 save();render();
}
function showGameOver(){if(document.getElementById('gameover'))return;let w=S.parties.slice().sort((a,b)=>b.support-a.support)[0];let d=document.createElement('div');d.id='gameover';d.className='gameover';d.innerHTML=`<div class="gameover-box"><h2>ПОРАЖЕНИЕ</h2><p>Твоя партия <b>${S.playerParty}</b> проиграла выборы и потеряла власть.</p><p>Победитель: <b>${S.party}</b><br>Теперь правительство сформирует другая партия.</p><button class="primary" onclick="resetGame()">Начать новую кампанию</button></div>`;document.body.appendChild(d)}
function drawOne(id,series){let cv=document.getElementById(id);if(!cv)return;let rect=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=Math.max(300,rect.width*dpr);cv.height=Math.max(160,rect.height*dpr);let x=cv.getContext('2d'),w=cv.width,h=cv.height,pad=34;x.clearRect(0,0,w,h);x.font=`${11*dpr}px system-ui`;x.fillStyle='#a9bacb';x.strokeStyle='#344b63';for(let i=0;i<4;i++){let y=pad+(h-pad*1.5)*i/3;x.beginPath();x.moveTo(pad,y);x.lineTo(w-8,y);x.stroke()}let hist=(S.history||[]).slice(-60);if(hist.length<2){x.fillText('График появится после нескольких месяцев игры',pad,h/2);return}let all=series.map(z=>hist.map(q=>Number(q[z.key]||0)));let max=Math.max(1,...all.flat()),min=Math.min(0,...all.flat());if(max===min)max=min+1;series.forEach((z,j)=>{x.strokeStyle=z.color;x.lineWidth=2.5*dpr;x.beginPath();all[j].forEach((v,i)=>{let px=pad+i/(hist.length-1)*(w-pad-12),py=h-pad-(v-min)/(max-min)*(h-pad*1.6);if(i===0)x.moveTo(px,py);else x.lineTo(px,py)});x.stroke();x.fillStyle=z.color;x.fillText(z.name, pad+j*125*dpr, h-5*dpr)});}
function drawCharts(){drawOne('chartEconomy',[{key:'gdp',name:'ВВП',color:'#69aef2'},{key:'money',name:'Казна',color:'#55c58a'},{key:'debt',name:'Долг',color:'#ef6d72'}]);drawOne('chartPolitics',[{key:'partySupport',name:'Твоя партия',color:'#f0bd58'},{key:'approval',name:'Одобрение',color:'#69aef2'},{key:'stability',name:'Стабильность',color:'#55c58a'}]);drawOne('chartPopulation',[{key:'pop',name:'Население',color:'#69aef2'},{key:'food',name:'Еда',color:'#55c58a'},{key:'fuel',name:'Топливо',color:'#f0bd58'}]);}
function income(){return Math.max(100,Math.round(S.gdp*S.tax/100/12*.35*difficulty().income))}function expenses(){return Math.round((300+S.pop/100000*S.health*.025+S.pop/100000*S.education*.02+S.defense*25+S.army/1000*1.5)*difficulty().expenses)}
window.setv=(k,v,id,s)=>{$('#'+id).textContent=v+s;S[k]=+v};
window.campaignAction=(a)=>{if(S.campaignOver)return;let p=S.parties.find(x=>x.name===S.playerParty);if(!p)return;let cost=a==='rally'?250:400;if(S.money<cost){toast('В казне недостаточно средств');return}S.money-=cost;p.support=clamp(p.support+(a==='rally'?3.5:5)*difficulty().playerDrift);S.approval=clamp(S.approval+(a==='rally'?1:2)*difficulty().approval);log(a==='rally'?'Партия провела предвыборный митинг.':'Партия опубликовала новую программу.');save();render();toast('Популярность твоей партии выросла')};
window.saveBudget=()=>{log('Утверждён новый государственный бюджет.');save();toast('Бюджет применён')};
window.act=(a)=>{if(S.campaignOver){toast('Кампания завершена. Начни новую игру.');return}let cost=0,msg='';switch(a){
case'roads':cost=500;S.regions.forEach(r=>r.infra=clamp(r.infra+5));S.gdp+=150;msg='Начато строительство дорог.';break;
case'aid':cost=300;S.approval=clamp(S.approval+5);S.stability=clamp(S.stability+3);msg='Населению выделена помощь.';break;
case'reform':cost=700;S.tech=clamp(S.tech+5);S.employment=clamp(S.employment+2);S.approval=clamp(S.approval-1);msg='Проведена государственная реформа.';break;
case'industry':cost=800;S.gdp+=700;S.employment=clamp(S.employment+3);S.steel=clamp(S.steel+5);msg='Промышленность получила инвестиции.';break;
case'trade':cost=200;S.money+=350;S.gdp+=120;msg='Подписано торговое соглашение.';break;
case'debt':if(S.debt<=0){toast('Государственного долга нет');return}S.money-=Math.min(1000,S.money);S.debt=Math.max(0,S.debt-1000);msg='Часть долга погашена.';break;
case'recruit':cost=400;S.army+=5000;S.morale=clamp(S.morale-2);msg='Набрано 5 000 военнослужащих.';break;
case'train':cost=250;S.training=clamp(S.training+8);S.morale=clamp(S.morale+3);msg='Проведены военные учения.';break;
case'equipment':cost=500;S.equipment=clamp(S.equipment+15);S.ammo=clamp(S.ammo+8);msg='Закуплено вооружение.';break;
case'mobilize':S.army+=15000;S.stability=clamp(S.stability-4);S.money-=250;msg='Объявлена мобилизация.';break;
case'demobilize':S.army=Math.max(10000,S.army-10000);S.stability=clamp(S.stability+2);msg='Часть войск демобилизована.';break;
case'war':S.war=!S.war;S.threat=clamp(S.threat+(S.war?20:-15));msg=S.war?'Введено военное положение.':'Военное положение отменено.';break;
case'speech':S.approval=clamp(S.approval+3);S.legitimacy=clamp(S.legitimacy+2);msg='Глава государства выступил с обращением.';break;
case'law':S.approval=clamp(S.approval+2);S.stability=clamp(S.stability+1);S.laws.push('Социальный закон');msg='Принят социальный закон.';break;
case'election':runElection();return;
case'security':cost=350;S.coupRisk=clamp(S.coupRisk-12);msg='Безопасность государственных учреждений усилена.';break;
}if(S.money<cost){toast('Недостаточно средств!');return}S.money-=cost;log(msg);save();render();toast(msg)};
window.regionAct=(i,a)=>{let r=S.regions[i],cost=a==='invest'?250:a==='aid'?100:0;if(S.money<cost){toast('Недостаточно средств');return}S.money-=cost;if(a==='invest'){r.wealth=clamp(r.wealth+7);r.infra=clamp(r.infra+5);r.industry=clamp(r.industry+4)}if(a==='aid'){r.loyalty=clamp(r.loyalty+8);r.unrest=clamp(r.unrest-7)}if(a==='police'){r.unrest=clamp(r.unrest-10);S.stability=clamp(S.stability+1)}log(`Приняты меры в регионе ${r.name}.`);save();render()};
window.diplomacy=(i,a)=>{let r=S.relations[i],cost=a==='talk'?100:a==='trade'?250:0;if(S.money<cost){toast('Недостаточно средств');return}S.money-=cost;r.value=clamp(r.value+(a==='talk'?8:a==='trade'?12:-15),-100,100);if(a==='trade')S.money+=150;log(`Изменены дипломатические отношения с государством ${r.name}.`);save();render()};
window.createDoc=()=>{let n=$('#docname').value.trim(),t=$('#doctext').value.trim();if(!n||!t){toast('Заполните название и текст');return}S.documents.unshift({name:n,type:$('#doctype').value,text:t,date:`${months[S.month]} ${S.year}, год`});log(`Подписан документ: ${n}.`);save();render()};
window.deleteDoc=i=>{S.documents.splice(i,1);save();render()};
function monthTick(){if(S.campaignOver)return;S.month++;if(S.month>=12){S.month=0;S.year++}let inc=income(),exp=expenses();S.money+=inc-exp;if(S.money<0){S.debt+=Math.abs(S.money);S.money=0;S.stability=clamp(S.stability-2);S.inflation=clamp(S.inflation+1,0,100)}else{S.debt=Math.max(0,S.debt-20);S.stability=clamp(S.stability+(S.money>10000?.2:-.2))}S.gdp=Math.max(100,S.gdp*(1+(S.tech/10000)+(S.employment-90)/10000-(S.inflation/20000)));S.pop=Math.max(100000,Math.round(S.pop*(1+(S.food-50)/1000000)));S.inflation=clamp(S.inflation+(S.money<1000?.3:-.08),0,100);S.food=clamp(S.food+(Math.random()*4-2)-(S.war?2:0));S.fuel=clamp(S.fuel+(Math.random()*3-1.5)-(S.war?3:0));S.energy=clamp(S.energy+(Math.random()*2-1));S.approval=clamp(S.approval+((S.money>5000?.15:-.35)+(S.inflation<10?.1:-.2))*difficulty().approval);S.legitimacy=clamp(S.legitimacy+(S.approval>50?.1:-.2));S.coupRisk=clamp(S.coupRisk+((S.stability<35?1.2:-.15)+(S.approval<25?.6:0))*difficulty().coup);S.regions.forEach(r=>{r.unrest=clamp(r.unrest+((S.stability<40?1:-.3)+(Math.random()-.5))*difficulty().unrest);r.loyalty=clamp(r.loyalty+(S.approval>50?.2:-.2));});if(S.war){S.ammo=clamp(S.ammo-2);S.equipment=clamp(S.equipment-.7);S.morale=clamp(S.morale-.4);S.threat=clamp(S.threat+1)}let my=S.parties.find(p=>p.name===S.playerParty);S.parties.forEach(p=>{let drift=(S.approval-50)*0.018+(S.stability-50)*0.008+(Math.random()-.5)*1.2;if(p.name===S.playerParty)p.support=clamp(p.support+drift*difficulty().playerDrift,2,75);else p.support=clamp(p.support-drift/(Math.max(1,S.parties.length-1))*difficulty().rivalPressure+(Math.random()-.5)*.7*difficulty().rivalPressure,2,75)});if(S.election>0)S.election--;if(S.election===0){runElection();if(S.campaignOver)return}if(!S.event&&Math.random()<Math.min(.25,.08*difficulty().unrest)){let events=[{title:'Экономический подъём',text:'Экспорт растёт, деловая активность повышается.',a:'Поддержать бизнес',b:'Сохранить доходы'},{title:'Региональные протесты',text:'В одном из регионов растёт недовольство.',a:'Выделить помощь',b:'Усилить контроль'},{title:'Научное открытие',text:'Учёные предлагают внедрить новую технологию.',a:'Финансировать',b:'Отложить'}];S.event=events[Math.floor(Math.random()*events.length)]}if(S.coupRisk>85&&Math.random()<.15){S.stability=clamp(S.stability-15);S.coupRisk=25;log('Попытка переворота сорвана, правительство ослаблено!')}log(`Завершён месяц. Бюджет: ${fmt(inc)} млн доходов, ${fmt(exp)} млн расходов.`);let mp=S.parties.find(p=>p.name===S.playerParty);S.history.push({year:S.year,month:S.month,gdp:S.gdp,money:S.money,debt:S.debt,approval:S.approval,stability:S.stability,partySupport:mp?mp.support:0,pop:S.pop,food:S.food,fuel:S.fuel});S.history=S.history.slice(-120);save();render()}
window.resolveEvent=choice=>{if(!S.event)return;let title=S.event.title;if(title==='Экономический подъём'){if(choice===0){if(S.money>=300){S.money-=300;S.gdp+=500;S.employment=clamp(S.employment+2)}}else S.money+=250}else if(title==='Региональные протесты'){if(choice===0&&S.money>=400){S.money-=400;S.stability=clamp(S.stability+5)}else{S.stability=clamp(S.stability-4);S.coupRisk=clamp(S.coupRisk+4)}}else if(title==='Научное открытие'){if(choice===0&&S.money>=500){S.money-=500;S.tech=clamp(S.tech+6)}else S.approval=clamp(S.approval-1)}else{if(choice===0){S.approval=clamp(S.approval+3);S.legitimacy=clamp(S.legitimacy+3)}else{S.legitimacy=clamp(S.legitimacy-8);S.coupRisk=clamp(S.coupRisk+5)}}log(`Решено событие: ${title}.`);S.event=null;save();render()};
window.exportSave=()=>{let blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='novaria-save.json';a.click();URL.revokeObjectURL(a.href)};
window.importSave=()=>{let f=$('#importfile').files[0];if(!f){toast('Выберите файл');return}let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.regions||!x.parties)throw 0;S={...initial(),...x};save();render();toast('Сохранение загружено')}catch{toast('Неверный файл сохранения')}};r.readAsText(f)};
window.resetGame=()=>{if(confirm('Начать новую кампанию? Текущий прогресс будет удалён.')){stop();S=initial();S.difficulty=selectedDifficulty||'normal';if(S.difficulty==='story'){S.money=26000;S.approval=72;S.stability=78;S.parties[0].support=42;S.parties[1].support=22;S.parties[2].support=19;S.parties[3].support=17}else if(S.difficulty==='easy'){S.money=22000;S.approval=67;S.stability=73;S.parties[0].support=38;S.parties[1].support=23;S.parties[2].support=20;S.parties[3].support=19}else if(S.difficulty==='hard'){S.money=14500;S.approval=54;S.stability=59;S.parties[0].support=30;S.parties[1].support=28;S.parties[2].support=22;S.parties[3].support=20}else if(S.difficulty==='expert'){S.money=10500;S.approval=47;S.stability=50;S.parties[0].support=26;S.parties[1].support=30;S.parties[2].support=24;S.parties[3].support=20}S.history=[];let mp=S.parties.find(p=>p.name===S.playerParty);S.history.push({year:S.year,month:S.month,gdp:S.gdp,money:S.money,debt:S.debt,approval:S.approval,stability:S.stability,partySupport:mp?mp.support:0,pop:S.pop,food:S.food,fuel:S.fuel});save();document.getElementById('gameover')?.remove();tab='overview';render();toast('Новая кампания: '+difficulty().label)}};
function play(){if(running||S.campaignOver){if(S.campaignOver)toast('Кампания завершена — начни новую игру');return}running=true;timer=setInterval(monthTick,+$('#speed').value);stats()}
function pause(){running=false;clearInterval(timer);timer=null;stats()}
function stop(){pause();$('#speed').value='1800';toast('Время остановлено, скорость сброшена до 1×')}
$('#play').onclick=play;$('#pause').onclick=pause;$('#stop').onclick=stop;$('#step').onclick=()=>{pause();monthTick()};$('#speed').onchange=()=>{if(running){pause();play()}};
$('#tabs').onclick=e=>{let b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render()}};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
render();})();
</script></body></html>
