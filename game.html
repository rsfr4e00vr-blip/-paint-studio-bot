<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Симулятор государства</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head><body>
<header><div class="emblem" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#d6b25e" stroke-width="1.8"><path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"/><path d="M12 8v8M8 12h8"/></svg></div><div><h1>Республика Новария</h1><p id="subtitle">Управляйте страной без ограничения срока правления</p></div></header>
<main>
<section class="timebar"><div class="time-now" id="clock">Год 1 · Январь</div><button id="play" class="good">▶ Играть</button><button id="pause">⏸ Пауза</button><button id="stop" class="danger">⏹ Стоп</button><button id="step" class="primary">+ 1 месяц</button><label>Скорость</label><select id="speed"><option value="3000">0.5×</option><option value="1800" selected>1×</option><option value="900">2×</option><option value="400">5×</option><option value="150">10×</option><option value="50">30×</option></select><span class="pill" id="runstate">Пауза</span></section>
<div class="topline" id="stats"></div>
<div class="tabbar" id="tabs"><button data-tab="overview">Обзор</button><button data-tab="economy">Экономика</button><button data-tab="resources">Ресурсы</button><button data-tab="market">Рынок</button><button data-tab="world">Мир и страны</button><button data-tab="charts">Графики</button><button data-tab="military">Армия</button><button data-tab="politics">Политика</button><button data-tab="regions">Регионы</button><button data-tab="diplomacy">Дипломатия</button><button data-tab="finance">Финансы</button><button data-tab="power">Власть</button><button data-tab="people">Люди</button><button data-tab="deputies">Депутаты</button><button data-tab="arms">Арсенал</button><button data-tab="comeback">Возврат</button><button data-tab="documents">Документы</button><button data-tab="events">События</button><button data-tab="settings">Настройки</button></div>
<div id="content"></div></main><div class="notice" id="notice"></div>
<script src="/game.js"></script></body></html>
