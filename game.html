<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0a14"><title>Государство</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--t:#f7f4ff;--m:#a79fc9;--g1:#8b5cf6;--g2:#3df5ff;--ok:#3ddc97;--bad:#ff5d73}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#0b0a14;color:var(--t);font:14px ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none}
body{background:radial-gradient(circle at 10% 0,#3b1d6e66,transparent 50%),radial-gradient(circle at 95% 100%,#0a6e8a55,transparent 45%),#0b0a14;padding:0 10px calc(90px + env(safe-area-inset-bottom));padding-top:max(10px,env(safe-area-inset-top))}
button{font:inherit;color:var(--t);background:#ffffff14;border:1px solid #ffffff22;border-radius:14px;min-height:40px;padding:0 12px;font-weight:600}
button:active{transform:scale(.94)}button.on{background:linear-gradient(135deg,var(--g1),var(--g2));border-color:transparent;color:#06122b;font-weight:800}
header{display:flex;justify-content:space-between;align-items:center;padding:6px 2px 10px}h1{font-size:19px;margin:0}
.tabs{display:flex;gap:4px;position:fixed;left:0;right:0;bottom:0;padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:#14102ad9;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid #ffffff22;z-index:5}.tabs button{flex:1;padding:0 2px;font-size:11px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.card{background:#ffffff0f;border:1px solid #ffffff1c;border-radius:16px;padding:10px 12px}.card small{color:var(--m);display:block}.card b{font-size:19px}
.ok{color:var(--ok)}.bad{color:var(--bad)}h3{margin:14px 2px 6px;font-size:15px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.big{width:100%;min-height:48px;font-size:16px}
label{display:flex;align-items:center;gap:8px;margin:6px 0;color:var(--m)}label span{min-width:110px;font-size:13px}label b{min-width:48px;text-align:right;color:var(--t)}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:8px;border-radius:99px;background:linear-gradient(90deg,var(--g1),var(--g2))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--g1)}
.nw{padding:8px 10px;margin:6px 0;border-radius:12px;background:#ffffff0d;border-left:3px solid var(--g1)}.nw small{color:var(--m)}.nw.bad{border-color:var(--bad)}.nw.ok{border-color:var(--ok)}
svg{width:100%;height:140px;background:#ffffff0a;border-radius:14px}
.msg{padding:14px;border-radius:16px;background:#ff5d7322;border:1px solid var(--bad);margin:10px 0}
.choice{padding:12px;margin:8px 0;border-radius:14px;background:#ffffff12;border:1px solid #ffffff22}
.choice button{width:100%;margin-top:6px;text-align:left}
.hint{font-size:12px;color:var(--m);margin:4px 0 10px}
.warn{background:#ff5d7322;border:1px solid var(--bad);border-radius:12px;padding:8px 10px;margin:8px 0;font-size:13px}
</style></head><body>
<header><h1>🏛 Государство</h1><div id="hd"></div></header>
<main id="v"></main>
<nav class="tabs">
  <button data-t="ov">📊 Обзор</button>
  <button data-t="bd">💰 Бюджет</button>
  <button data-t="tx">🧾 Налоги</button>
  <button data-t="sc">👥 Общество</button>
  <button data-t="nw">📰 Новости</button>
</nav>
<script>
(()=>{
const tg=window.Telegram&&Telegram.WebApp;if(tg){try{tg.ready();tg.expand();tg.disableVerticalSwipes&&tg.disableVerticalSwipes()}catch(e){}}
const $=s=>document.querySelector(s),f=(x,d=1)=>(+x).toFixed(d),cl=(x,a,b)=>Math.max(a,Math.min(b,x)),MN='янв фев мар апр май июн июл авг сен окт ноя дек'.split(' ');
const KEY='stateSim3';

/* ========== СТАРТОВЫЙ БАЛАНС ==========
   Экономика стартует в равновесии:
   - Рост ~2.5%, инфляция ~3.8%, безработица ~6.2%
   - Долг 55% ВВП, резервы нормальные
   - Коррупция средняя (28), торговый баланс слегка +
   - Чтобы побеждать — нужно активно управлять, а не «оставить как есть»
*/
const NEW=()=>({
  m:0,gdp:1000,pop:10.0,g:2.5,inf:3.8,u:6.2,debt:550,res:120,fx:100,rate:5.5,app:52,
  inc:16,corp:19,vat:18,
  sp:{soc:6.5,hlt:3.2,edu:3.2,def:1.8,inf:2.8,adm:1.4,anti:0.6},
  ix:{inf:48,edu:47,hlt:49},
  corr:28,birth:1.35,death:0.95,mig:0.15,
  oil:72,exp:175,imp:155,inv:11.5,
  camp:0,opp:42,
  last:{rev:0,sp:0,int:0,bal:0,tb:0},
  hist:[],news:[],over:null,tab:'ov',met:'g',rng:12,ask:false,event:null
});

let S;try{S=JSON.parse(localStorage.getItem(KEY))||NEW()}catch(e){S=NEW()}
if(S.corr===undefined){Object.assign(S,NEW());S.m=0}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const date=()=>MN[S.m%12]+' '+(2026+Math.floor(S.m/12));
const dr=()=>S.debt/S.gdp*100;
const tb=()=>S.exp-S.imp;
function news(t,k){S.news.unshift({d:date(),t,k:k||''});if(S.news.length>90)S.news.pop()}

const EV=[
  ['Мировые цены на энергоносители выросли.',{g:.35,oil:14,fx:-.6,app:1.2,exp:8},'ok'],
  ['Мировая рецессия ударила по экспорту.',{g:-1.0,exp:-22,fx:.8,app:-2.5},'bad'],
  ['Неурожай поднял цены на продукты.',{inf:.85,app:-2.2},'bad'],
  ['Рекордный урожай удешевил продукты.',{inf:-.45,g:.25,app:1.5},'ok'],
  ['Крупный иностранный инвестор открыл заводы.',{g:.55,inv:2.0,app:2.5,exp:6},'ok'],
  ['Забастовки транспортников нарушили логистику.',{g:-.55,inf:.35,app:-2},'bad'],
  ['Технологический прорыв поднял производительность.',{g:.65,inv:1.2,app:1.2},'ok'],
  ['Санкции ограничили экспорт ключевых товаров.',{g:-.9,exp:-28,fx:1.4,app:-3.5},'bad'],
  ['Приток мигрантов увеличил рабочую силу.',{mig:.7,u:-.5,app:-1.2},'ok'],
  ['Отток квалифицированных кадров усилился.',{mig:-.6,g:-.35,app:-2,ix:{edu:-2}},'bad'],
  ['Банковский кризис в соседней стране.',{g:-.4,fx:.9,res:-8},'bad'],
  ['Удачная торговая сделка расширила рынки сбыта.',{exp:18,g:.4,app:1.5},'ok']
];

const CHOICES=[
  {t:'Коррупционный скандал в министерстве. Что делать?',
   opts:[
     {l:'Жёстко расследовать и уволить виновных (−коррупция, +рейтинг)',eff:{corr:-9,app:5,sp:{adm:0.25}}},
     {l:'Замять дело (рейтинг почти не падает, коррупция растёт)',eff:{corr:6,app:-1.5}},
     {l:'Назначить «независимую» комиссию (имитация)',eff:{corr:3,app:-4}}
   ]},
  {t:'Профсоюзы требуют повышения зарплат в госсекторе.',
   opts:[
     {l:'Согласиться полностью (+соцрасходы, +рейтинг)',eff:{sp:{soc:1.3},app:6,g:-.25}},
     {l:'Частично удовлетворить',eff:{sp:{soc:0.55},app:2.5}},
     {l:'Отказать — бюджет важнее',eff:{app:-7,u:0.6}}
   ]},
  {t:'Иностранный фонд предлагает крупный кредит под реформы.',
   opts:[
     {l:'Взять и реально провести реформы',eff:{debt:45,res:45,corr:-5,g:.55,inv:1.5}},
     {l:'Взять деньги, реформы отложить',eff:{debt:45,res:45,corr:4}},
     {l:'Отказаться от внешней помощи',eff:{app:2.5}}
   ]},
  {t:'Экологи требуют жёстких норм. Бизнес против.',
   opts:[
     {l:'Ввести жёсткие экологические нормы',eff:{g:-.45,app:3.5,ix:{inf:4}}},
     {l:'Компенсации бизнесу + мягкие меры',eff:{sp:{inf:0.5},app:1.5}},
     {l:'Игнорировать — экономика важнее',eff:{app:-5,g:.25}}
   ]},
  {t:'Оппозиция собирает митинги. Как реагировать?',
   opts:[
     {l:'Диалог и уступки по соцполитике',eff:{app:3,sp:{soc:0.6},opp:-4}},
     {l:'Жёсткий порядок (силовой ответ)',eff:{app:-2,opp:6,sp:{def:0.3}}},
     {l:'Игнорировать',eff:{opp:3,app:-1}}
   ]}
];

function step(){
  if(S.over)return;
  const s=S,sp=s.sp;
  const sum=Object.values(sp).reduce((a,b)=>a+b,0);

  // ===== БЮДЖЕТ =====
  // Коррупция сильно снижает собираемость (до −35% при 90%)
  const taxEff=cl(1-s.corr/140,0.55,1);
  const laborShare=cl(1-s.u/100,0.65,0.98);
  const rev=s.gdp/12*(
    0.48*s.inc/100*laborShare +
    0.27*s.corp/100 +
    0.30*s.vat/100
  )*taxEff;

  const spend=s.gdp/12*sum/100;
  // Проценты по долгу зависят от ставки и риска (высокий долг = дороже)
  const riskPremium=Math.max(0,(dr()-50)/80);
  const int=s.debt*(s.rate*0.55 + 0.8 + riskPremium*2.2)/1200;
  const bal=rev-spend-int;

  if(bal<0){
    const fromRes=Math.min(s.res, -bal);
    s.res-=fromRes;
    s.debt+=(-bal-fromRes);
  }else{
    s.res+=bal*0.40;
    s.debt=Math.max(0,s.debt-bal*0.35);
  }

  // ===== ТОРГОВЛЯ =====
  // Экспорт: рост + цена сырья + инвестиции − коррупция
  s.exp=cl(
    s.exp*(1+(s.g-2.2)/180) +
    (s.oil-70)*0.42 +
    (s.inv-11)*1.1 -
    (s.corr-25)*0.35 +
    (Math.random()-0.5)*4
  ,40,520);

  // Импорт: рост + население + инфляция (дороже импорт)
  s.imp=cl(
    s.imp*(1+(s.g+s.inf*0.4)/220) +
    s.pop*1.35 +
    (s.fx-100)*0.15 +
    (Math.random()-0.5)*3
  ,50,480);

  const tbal=s.exp-s.imp;
  // Торговый баланс медленно двигает резервы
  s.res=cl(s.res+tbal/28,-50,800);
  s.last={rev,sp:spend,int,bal,tb:tbal};

  const def=-bal*12/s.gdp*100;
  const D=dr();
  const real=s.rate-s.inf;

  let sh={g:0,inf:0,fx:0,app:0,oil:0,exp:0,mig:0,inv:0,corr:0,res:0};

  // Случайные шоки
  if(Math.random()<0.09){
    const e=EV[Math.random()*EV.length|0];
    Object.assign(sh,e[1]);
    if(e[1].exp)s.exp+=e[1].exp;
    if(e[1].res)s.res+=e[1].res;
    news('⚡ '+e[0],e[2]);
  }

  // Интерактивные события
  if(!s.event && Math.random()<0.10){
    s.event=CHOICES[Math.random()*CHOICES.length|0];
  }

  // ===== ДЕМОГРАФИЯ =====
  const natGrowth=(s.birth-s.death+s.mig)/1200; // месячный
  s.pop=cl(s.pop*(1+natGrowth),3.5,35);

  // Рождаемость: соцполитика +, безработица −, рейтинг +, жильё/инфра +
  s.birth=cl(s.birth
    +0.018*(sp.soc-6.5)
    -0.012*(s.u-6)
    +0.006*(s.app-50)
    +0.004*(s.ix.inf-50)
  ,0.55,2.6);

  // Смертность: здравоохранение −, инфляция +, коррупция +
  s.death=cl(s.death
    -0.018*(s.ix.hlt-50)
    +0.012*(s.inf-4)
    +0.006*(s.corr-25)
  ,0.45,2.4);

  // Миграция: рост +, коррупция −, рейтинг +, безработица −
  s.mig=cl(s.mig
    +0.012*(s.g-2.3)
    -0.018*(s.corr-25)
    +0.009*(s.app-50)
    -0.015*(s.u-6)
    +(sh.mig||0)
  ,-1.8,2.8);

  // ===== КОРРУПЦИЯ =====
  // Растёт сама + от раздутого аппарата, падает от anti
  s.corr=cl(s.corr
    +0.28
    -sp.anti*2.1
    +(sp.adm>2.2?0.22:0)
    +(sp.def>3?0.08:0)
    +(sh.corr||0)
  ,4,92);

  // ===== ИНВЕСТИЦИИ =====
  // Налоги, ставка, коррупция, рейтинг, инфраструктура
  s.inv=cl(11.5
    -0.28*(s.corp-19)
    -0.18*(s.rate-5.5)
    -0.16*(s.corr-25)
    +0.07*(s.app-50)
    +0.04*(s.ix.inf-50)
    +(sh.inv||0)
  ,2.5,26);

  // Цена сырья
  s.oil=cl(s.oil+(sh.oil||0)+(Math.random()-0.5)*3.5,22,170);

  // ===== РОСТ, ИНФЛЯЦИЯ, БЕЗРАБОТИЦА =====
  const pg=s.g,pi=s.inf,pu=s.u;

  // Целевой рост — много факторов, но ни один не доминирует
  const tg=
    2.35
    +0.038*(s.ix.inf-50)
    +0.028*(s.ix.edu-50)
    +0.022*(s.ix.hlt-50)
    -0.13*(s.corp-19)
    -0.08*(s.inc-16)
    -0.05*(s.vat-18)
    -0.16*(real-1.8)
    +0.09*(3.5-def)           // умеренный дефицит иногда полезен
    -0.07*Math.max(0,D-55)
    -0.11*(s.corr-25)/12
    +0.09*(s.inv-11.5)
    +0.03*(s.pop-10)
    +(tbal>15?0.18:tbal<-25?-0.22:0)
    -0.04*Math.max(0,sum-22); // слишком большие расходы душат

  s.g=cl(pg*0.70 + tg*0.30 + (sh.g||0),-11,11);

  // Инфляция: разрыв выпуска, реальная ставка, дефицит, нефть, якорь
  s.inf=cl(pi
    +0.055*(s.g-2.3)
    -0.075*(real-1.5)
    +0.04*(def-2.5)
    +0.10*(3.6-pi)           // возврат к якорю
    +(s.oil-70)*0.009
    +(sh.inf||0)
  ,0.2,48);

  // Безработица: закон Оукена + миграция + миграция
  s.u=cl(pu
    -0.06*(s.g-2.3)
    +0.014*(6.2-pu)
    +0.007*(real-2)
    -0.025*(s.mig)
    +(sh.u||0)
  ,2.2,30);

  // Качество инфраструктуры/образования/здравоохранения
  // Коррупция снижает отдачу от расходов
  const corrDrag=1-s.corr/200;
  s.ix.inf=cl(s.ix.inf+(sp.inf-2.6)*1.25*corrDrag -0.22 -s.corr*0.008,0,100);
  s.ix.edu=cl(s.ix.edu+(sp.edu-3.2)*1.05*corrDrag -0.15 -s.corr*0.007,0,100);
  s.ix.hlt=cl(s.ix.hlt+(sp.hlt-3.2)*1.05*corrDrag -0.15 -s.corr*0.007,0,100);

  // ВВП
  s.gdp*=1+(s.g + s.inf*0.15)/1200; // номинальный с лёгким учётом инфляции
  s.gdp=Math.max(200,s.gdp);

  // Курс
  s.fx*=1
    +0.0012*(s.inf-3.5)
    -0.0010*(real-1.8)
    +0.0004*(def-2)
    -0.0005*(tbal/Math.max(s.gdp,1))
    +(sh.fx||0)/100;
  s.fx=cl(s.fx,40,220);

  // ===== РЕЙТИНГ =====
  let tar=52
    -1.45*(s.inf-3.5)
    -1.55*(s.u-6.2)
    +0.60*(s.g-2.3)
    +0.13*(s.ix.hlt-50)
    +0.09*(s.ix.edu-50)
    -0.40*(s.inc-16)
    -0.28*(s.vat-18)
    -0.06*(s.corp-19)
    +0.50*(sp.soc-6.5)
    -0.14*Math.max(0,D-50)
    -0.22*(s.corr-25)
    +(tbal>20?1.5:tbal<-30?-2:0)
    +(sh.app||0);

  // Год выборов — оппозиция давит сильнее
  const yearsLeft=4-(Math.floor(s.m/12)%4);
  if(yearsLeft===0) tar-=(s.opp-38)*0.22;

  s.app=cl(s.app+0.19*(tar-s.app),0,100);

  // Оппозиция
  s.opp=cl(s.opp
    +0.18
    -(s.app-50)*0.045
    +(s.corr-25)*0.035
    +(s.u>9?0.25:0)
    -s.camp*0.6
  ,18,88);

  s.m++;
  s.hist.push({g:s.g,inf:s.inf,u:s.u,d:D,a:s.app,fx:s.fx,gdp:s.gdp,corr:s.corr,pop:s.pop,tb:tbal});
  if(s.hist.length>240)s.hist.shift();

  // Авто-новости
  if(pi<=7.5&&s.inf>8)news('Инфляция превысила 8%: реальные доходы падают.','bad');
  if(pu<=9.5&&s.u>10)news('Безработица выше 10%: социальное напряжение растёт.','bad');
  if(pg>=0&&s.g<0)news('Экономика вошла в рецессию.','bad');
  if(pg<0&&s.g>=0)news('Рецессия закончилась — рост возобновился.','ok');
  if(s.res<15&&s.last.bal<0)news('Резервы почти исчерпаны, дефицит финансируется долгом.','bad');
  if(D>85&&s.m%5===0)news('Госдолг '+f(D,0)+'% ВВП — процентные платежи давят на бюджет.','bad');
  if(s.app<26&&s.m%4===0)news('Рейтинг '+f(s.app,0)+'%: на улицах всё чаще протесты.','bad');
  if(s.corr>52&&s.m%5===0)news('Коррупция '+f(s.corr,0)+'%: инвесторы и доноры осторожничают.','bad');
  if(s.m%3===0){
    const tbStr=tbal>=0?'+'+f(tbal,0):f(tbal,0);
    news('Квартал: '+(bal<0?'дефицит ':'профицит ')+f(Math.abs(def),1)+'% ВВП, торг. баланс '+tbStr+' млрд.',bal<0?'bad':'ok');
  }

  // ===== ВЫБОРЫ =====
  if(s.m>0&&s.m%48===0){
    // Нужный рейтинг зависит от силы оппозиции и кампании
    const threshold=40 + s.opp*0.22 - s.camp*1.1;
    if(s.app<threshold){
      s.over='Выборы проиграны. Рейтинг '+f(s.app,0)+'% при силе оппозиции '+f(s.opp,0)+'%. Нужно было ≥'+f(threshold,0)+'%.';
      news('🗳 '+s.over,'bad');
    }else{
      news('🗳 Выборы выиграны! Рейтинг '+f(s.app,0)+'%, оппозиция '+f(s.opp,0)+'%.','ok');
      s.camp=0;
      s.opp=cl(s.opp-10,20,65);
      s.app=cl(s.app+4,0,100);
    }
  }

  // Поражения
  if(D>160){s.over='Дефолт: госдолг превысил 160% ВВП. Кредиторы отказали.';news('💥 '+s.over,'bad')}
  if(s.app<6){s.over='Правительство отправлено в отставку. Рейтинг ниже 6%.';news('🔥 '+s.over,'bad')}
  if(s.pop<4.2){s.over='Демографический коллапс: население упало критически.';news('💀 '+s.over,'bad')}
  if(s.res<-30&&D>120){s.over='Валютный кризис + долговой кризис. Государство потеряло платёжеспособность.';news('💥 '+s.over,'bad')}

  save();
}

function chart(){
  const h=S.hist.slice(-(S.rng||240));
  if(h.length<2)return'<div class="card"><small>График появится после 2-го хода</small></div>';
  const v=h.map(x=>x[S.met]??0),mn=Math.min(...v),mx=Math.max(...v),r=mx-mn||1;
  const pts=v.map((y,i)=>(i/(v.length-1)*300).toFixed(1)+','+(120-(y-mn)/r*100).toFixed(1)).join(' ');
  return'<svg viewBox="0 0 300 140" preserveAspectRatio="none"><polyline fill="none" stroke="#3df5ff" stroke-width="2.5" points="'+pts+'"/></svg><div class="row" style="justify-content:space-between;color:var(--m)"><span>мин '+f(mn,1)+'</span><span>сейчас '+f(v[v.length-1],1)+'</span><span>макс '+f(mx,1)+'</span></div>';
}
