<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Государство — большая стратегия</title>
<style>
:root{--bg:#101722;--panel:#192536;--panel2:#213249;--line:#344960;--txt:#edf4fb;--muted:#a9bacb;--gold:#f0bd58;--green:#55c58a;--red:#ef6d72;--blue:#69aef2}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#0c1420,#142337);color:var(--txt);font:15px system-ui,Segoe UI,sans-serif}
header{padding:18px max(14px,calc((100% - 1250px)/2));background:#0b1320;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
h1{font-size:22px;margin:0 0 5px}header p{margin:0;color:var(--muted);font-size:13px}
main{max-width:1250px;margin:auto;padding:14px}.topline{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px}
.stat,.panel,.tabbar{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px}.stat small{display:block;color:var(--muted)}.stat b{font-size:19px}
.tabbar{display:flex;gap:7px;overflow:auto;margin-bottom:12px;padding:8px}.tabbar button{white-space:nowrap}
button,select,input,textarea{font:inherit}button{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:9px 12px;border-radius:9px;cursor:pointer}button:hover{border-color:var(--gold)}button.primary{background:#8a6426;border-color:#c3943e}button.danger{background:#612e38;border-color:#a64b58}button.good{background:#245640;border-color:#39835f}button:disabled{opacity:.4;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.wide{grid-column:1/-1}.panel h2{font-size:17px;margin:0 0 10px}.muted{color:var(--muted)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:7px 0}.row>*{flex:0 0 auto}label{color:var(--muted);font-size:13px}input,select,textarea{background:#0f1b2a;border:1px solid var(--line);color:var(--txt);padding:9px;border-radius:8px;max-width:100%}
.bar{height:9px;background:#0d1723;border-radius:20px;overflow:hidden;margin:5px 0 10px}.bar i{display:block;height:100%;background:var(--green)}.meter{min-width:110px;flex:1}.meter b{font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted)}.pill{display:inline-block;padding:3px 8px;border:1px solid var(--line);border-radius:20px;color:var(--muted);font-size:12px}
.cardlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}.mini{background:#122033;border:1px solid var(--line);border-radius:10px;padding:10px}.mini b{display:block;margin-bottom:5px}.log{max-height:240px;overflow:auto;font-size:13px;color:var(--muted)}.log div{padding:6px 0;border-bottom:1px solid #34496066}
#notice{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#263c52;border:1px solid var(--blue);padding:10px 16px;border-radius:10px;display:none;z-index:10;max-width:90vw}
.hidden{display:none!important}.choice{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px;border-bottom:1px solid var(--line)}.choice:last-child{border:0}
@media(max-width:760px){.topline{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.wide{grid-column:auto}header{position:static}main{padding:9px}.stat b{font-size:17px}}
</style></head><body>
<header><h1>🏛️ Государство: большая стратегия</h1><p>Управляй страной, экономикой, армией, регионами и политикой. Кампания — до 240 месяцев. Время не идёт само: месяц проходит только по кнопке.</p></header>
<main>
<div class="topline" id="stats"></div>
<div class="tabbar" id="tabs">
<button data-tab="overview">Обзор</button><button data-tab="economy">Экономика</button><button data-tab="military">Армия</button><button data-tab="politics">Политика</button><button data-tab="regions">Регионы</button><button data-tab="diplomacy">Дипломатия</button><button data-tab="documents">Документы</button><button data-tab="events">События</button><button data-tab="settings">Сохранение</button>
</div>
<div id="content"></div>
</main><div id="notice"></div>
<script>
const $=s=>document.querySelector(s), clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v)), fmt=n=>Math.round(n).toLocaleString('ru-RU');
const defaults=()=>({name:"Республика Новария",month:1,year:1,difficulty:"normal",money:18000,debt:0,pop:8200000,gdp:42000,inflation:5,employment:94,stability:68,approval:61,legitimacy:70,food:78,fuel:65,steel:55,equipment:48,ammo:62,energy:72,tech:32,army:42000,navy:8,air:45,training:58,morale:65,threat:20,war:false,gov:"Парламентская республика",leader:"Александр Ветров",party:"Центристский союз",election:24,coupRisk:12,lawIds:[],parties:[{name:"Центристский союз",support:34,seats:38,ideology:"Центр"},{name:"Народная партия",support:25,seats:27,ideology:"Консерватизм"},{name:"Партия реформ",support:21,seats:22,ideology:"Либерализм"},{name:"Социальный альянс",support:20,seats:13,ideology:"Социал-демократия"}],regions:[{name:"Столица",pop:1200000,wealth:82,loyalty:76,unrest:10,industry:70,infra:88,resource:"Услуги"},{name:"Северный край",pop:1600000,wealth:55,loyalty:64,unrest:18,industry:48,infra:55,resource:"Лес"},{name:"Восточная область",pop:2100000,wealth:48,loyalty:57,unrest:24,industry:75,infra:49,resource:"Сталь"},{name:"Южная провинция",pop:1900000,wealth:51,loyalty:60,unrest:20,industry:42,infra:53,resource:"Зерно"},{name:"Западный округ",pop:1400000,wealth:62,loyalty:68,unrest:14,industry:58,infra:67,resource:"Энергия"}],relations:[{name:"Аркания",value:15,power:65},{name:"Белория",value:48,power:42},{name:"Тарвия",value:-20,power:80}],log:["Вы сформировали правительство. Перед вами 20 лет управления."],documents:[],event:null,ended:false});
let S=load()||defaults(),tab="overview";
function load(){try{return JSON.parse(localStorage.getItem("novariaSave"))}catch{return null}}
function save(){localStorage.setItem("novariaSave",JSON.stringify(S))}
function note(t){let n=$("#notice");n.textContent=t;n.style.display="block";setTimeout(()=>n.style.display="none",2300)}
function log(t){S.log.unshift(`Месяц ${S.month}, год ${S.year}: ${t}`);S.log=S.log.slice(0,80)}
function difficulty(){return {easy:{cost:0,income:1.2,unrest:.7,label:"Лёгкая"},normal:{cost:1,income:1,label:"Нормальная"},hard:{cost:1.25,income:.85,label:"Сложная"},expert:{cost:1.55,income:.7,label:"Эксперт"} }[S.difficulty]}
function spend(n){n=Math.ceil(n*difficulty().cost);if(S.money<n){note("Недостаточно денег в казне");return false}S.money-=n;return true}
function stat(label,value,suffix="",color=""){return `<div class="stat"><small>${label}</small><b style="${color?`color:${color}`:""}">${fmt(value)}${suffix}</b></div>`}
function meter(label,v){return `<div class="meter"><b>${label}: ${fmt(v)}%</b><div class="bar"><i style="width:${clamp(v)}%"></i></div></div>`}
function render(){save();$("#stats").innerHTML=stat("Казна",S.money," ₵")+stat("Население",S.pop/1e6," млн")+stat("Стабильность",S.stability,"%")+stat("Одобрение",S.approval,"%")+stat("Армия",S.army," чел.")+stat("Кампания",`${S.month}/240`," мес.");$("#tabs").querySelectorAll("button").forEach(b=>b.classList.toggle("primary",b.dataset.tab===tab));let c=$("#content");c.innerHTML=views[tab]();c.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>act(b.dataset.act,b.dataset.arg));}
const views={
overview:()=>`<div class="grid"><section class="panel"><h2>👑 Государственный обзор</h2><div class="row"><span class="pill">${S.gov}</span><span class="pill">${S.difficulty==="normal"?"Нормальная":difficulty().label} сложность</span><span class="pill">${S.month} месяц / ${S.year} год</span></div><p>Глава государства: <b>${S.leader}</b><br>Правящая партия: <b>${S.party}</b></p>${meter("Стабильность",S.stability)}${meter("Поддержка населения",S.approval)}${meter("Легитимность",S.legitimacy)}${meter("Риск переворота",S.coupRisk)}<button class="primary" data-act="next">⏩ Завершить месяц</button> <button data-act="election">🗳️ Провести досрочные выборы</button></section><section class="panel"><h2>📌 Ключевые задачи</h2><div class="cardlist"><div class="mini"><b>Экономика</b>ВВП на душу: ${fmt(S.gdp)} ₵<br>Инфляция: ${S.inflation}%<br>Занятость: ${S.employment}%</div><div class="mini"><b>Государственные резервы</b>Продовольствие: ${S.food}%<br>Топливо: ${S.fuel}%<br>Энергия: ${S.energy}%</div><div class="mini"><b>Оборона</b>Боеприпасы: ${S.ammo}%<br>Техника: ${S.equipment}%<br>Боевой дух: ${S.morale}%</div></div></section><section class="panel wide"><h2>📰 Последние новости</h2><div class="log">${S.log.slice(0,9).map(x=>`<div>${x}</div>`).join("")}</div></section></div>`,
economy:()=>`<div class="grid"><section class="panel"><h2>💰 Финансы и экономика</h2><p>ВВП на душу: <b>${fmt(S.gdp)} ₵</b> · Госдолг: <b>${fmt(S.debt)} ₵</b></p>${meter("Занятость",S.employment)}${meter("Инфляция (чем ниже, тем лучше)",100-S.inflation)}<div class="row"><button data-act="taxup">Повысить налоги (+доход, −одобрение)</button><button data-act="taxdown">Снизить налоги (−доход, +одобрение)</button></div><div class="row"><button data-act="industry">🏭 Инвестировать в промышленность (₵3500)</button><button data-act="research">🔬 Научная программа (₵2800)</button></div><div class="row"><button data-act="welfare">🤝 Социальная программа (₵2200)</button><button data-act="infrastructure">🛣️ Инфраструктура (₵3000)</button></div></section><section class="panel"><h2>📦 Запасы страны</h2>${["food","fuel","steel","equipment","ammo","energy"].map((k,i)=>meter(["Продовольствие","Топливо","Сталь","Военная техника","Боеприпасы","Энергия"][i],S[k])).join("")}<div class="row"><button data-act="import">🚢 Импорт ресурсов (₵1800)</button><button data-act="ration">Ввести экономию ресурсов</button></div></section></div>`,
military:()=>`<div class="grid"><section class="panel"><h2>🪖 Вооружённые силы</h2><div class="cardlist"><div class="mini"><b>Сухопутные войска</b>${fmt(S.army)} военнослужащих</div><div class="mini"><b>Авиация</b>${S.air} эскадрилий</div><div class="mini"><b>Флот</b>${S.navy} кораблей</div></div>${meter("Подготовка",S.training)}${meter("Боевой дух",S.morale)}<div class="row"><button data-act="recruit">➕ Набрать 5 000 солдат (₵2400)</button><button data-act="train">🎯 Учения (₵1500)</button><button data-act="buyarms">🛠️ Закупить технику (₵2600)</button></div><div class="row"><button data-act="reserve">Объявить резерв</button><button data-act="demobilize">Сократить армию</button></div></section><section class="panel"><h2>🛡️ Безопасность и оборона</h2>${meter("Внешняя угроза",S.threat)}<p>Состояние: <b>${S.war?"Военное положение":"Мирное время"}</b></p><button class="danger" data-act="mobilize">⚠️ Частичная мобилизация</button> <button data-act="defense">Укрепить границы (₵2000)</button><p class="muted">Военные ресурсы расходуются на содержание армии и могут повлиять на экономику. Решения о войне не принимаются автоматически.</p></section></div>`,
politics:()=>`<div class="grid"><section class="panel"><h2>🏛️ Политическая система</h2><p>Форма правления: <b>${S.gov}</b></p><div class="row"><select id="gov"><option>Парламентская республика</option><option>Президентская республика</option><option>Конституционная монархия</option><option>Федеративная республика</option><option>Военная администрация</option></select><button data-act="changegov">Изменить строй</button></div><h2>Партии и парламент</h2>${S.parties.map((p,i)=>`<div class="choice"><span><b>${p.name}</b><br><small class="muted">${p.ideology} · ${p.seats} мест</small></span><span>${p.support}%</span></div>`).join("")}<div class="row"><input id="newparty" placeholder="Название новой партии"><button data-act="party">Зарегистрировать партию</button></div></section><section class="panel"><h2>📜 Законы и государственные решения</h2>${["Антикоррупционная реформа|1200|+легитимность","Повышение минимальной зарплаты|1800|+одобрение","Независимость судов|1500|+стабильность","Расширение полномочий регионов|1300|+лояльность","Государственная цифровизация|2000|+ВВП","Обязательная военная служба|900|+оборона"].map((x,i)=>{let a=x.split("|");return `<div class="choice"><span><b>${a[0]}</b><br><small class="muted">${a[2]}</small></span><button data-act="law" data-arg="${i}">Принять · ₵${a[1]}</button></div>`}).join("")}<div class="row"><button data-act="campaign">📣 Национальная кампания (₵900)</button><button data-act="cabinet">🔁 Переформировать кабинет</button></div></section></div>`,
regions:()=>`<section class="panel"><h2>🗺️ Регионы и местное управление</h2><p class="muted">Инвестируй в регионы, назначай приоритеты и следи за недовольством.</p><div class="cardlist">${S.regions.map((r,i)=>`<div class="mini"><b>${r.name}</b><small class="muted">${fmt(r.pop)} жителей · ресурс: ${r.resource}</small>${meter("Благосостояние",r.wealth)}${meter("Лояльность",r.loyalty)}${meter("Недовольство",r.unrest)}<div class="row"><button data-act="region" data-arg="${i}">Инвестировать ₵1200</button><button data-act="police" data-arg="${i}">Снизить беспорядки</button></div></div>`).join("")}</div></section>`,
diplomacy:()=>`<div class="grid"><section class="panel"><h2>🌐 Международные отношения</h2>${S.relations.map((r,i)=>`<div class="choice"><span><b>${r.name}</b><br><small class="muted">Военная мощь: ${r.power}/100</small></span><span>Отношения: ${r.value}</span><button data-act="diplomat" data-arg="${i}">Переговоры ₵700</button></div>`).join("")}<div class="row"><button data-act="trade">📦 Торговое соглашение</button><button data-act="alliance">🤝 Предложить союз</button></div></section><section class="panel"><h2>🕊️ Внешняя политика</h2><p>Уровень угрозы: <b>${S.threat}/100</b></p><button data-act="peace">Мирная инициатива</button><button data-act="intel">Разведывательный анализ</button><p class="muted">Дипломатия влияет на торговлю, угрозы и устойчивость страны.</p></section></div>`,
documents:()=>`<div class="grid"><section class="panel"><h2>📑 Государственные документы</h2><p class="muted">Создавай игровые документы: указы, бюджеты, законы, доклады и протоколы. Это внутриигровые тестовые документы, не официальные юридические формы.</p><div class="row"><select id="doctype"><option>Указ президента</option><option>Законопроект</option><option>Государственный бюджет</option><option>Доклад министерства</option><option>Протокол заседания</option><option>План развития региона</option></select><input id="doctitle" placeholder="Название документа"></div><textarea id="docbody" rows="5" style="width:100%" placeholder="Текст, цели, сроки и ответственные..."></textarea><div class="row"><button class="primary" data-act="document">Создать документ</button><button data-act="exportdocs">Экспорт документов</button></div></section><section class="panel"><h2>📚 Архив документов (${S.documents.length})</h2>${S.documents.length?S.documents.map((d,i)=>`<div class="choice"><span><b>${d.title}</b><br><small class="muted">${d.type} · месяц ${d.month}</small></span><button data-act="viewdoc" data-arg="${i}">Открыть</button></div>`).join(""):"<p class='muted'>Пока документов нет.</p>"}</section></div>`,
events:()=>`<div class="grid"><section class="panel"><h2>⚡ События и кризисы</h2><p>Случайные события возникают при переходе месяца. Иногда решения требуют денег, иногда — политического капитала.</p>${S.event?`<div class="mini"><b>${S.event.title}</b><p>${S.event.text}</p>${S.event.options.map((o,i)=>`<button data-act="event" data-arg="${i}">${o.label}</button>`).join(" ")}</div>`:"<p class='muted'>Сейчас нет события, требующего решения.</p>"}<button data-act="trigger">Проверить кризисные риски</button></section><section class="panel"><h2>🚨 Перевороты и внутренние угрозы</h2>${meter("Риск переворота",S.coupRisk)}<p>Риск растёт при низкой стабильности, недовольстве регионов и падении лояльности армии.</p><button data-act="counter">Укрепить гражданский контроль (₵1600)</button><button class="danger" data-act="coup">Смоделировать попытку переворота</button><p class="muted">Переворот может быть предотвращён или привести к смене правительства и потере легитимности.</p></section></div>`,
settings:()=>`<div class="grid"><section class="panel"><h2>⚙️ Новая кампания</h2><div class="row"><label>Сложность</label><select id="difficulty"><option value="easy">Лёгкая</option><option value="normal">Нормальная</option><option value="hard">Сложная</option><option value="expert">Эксперт</option></select><button data-act="difficulty">Применить</button></div><p class="muted">Сложность влияет на стоимость действий, доходы и рост беспорядков.</p><button class="danger" data-act="new">Начать новую кампанию</button></section><section class="panel"><h2>💾 Сохранение и перенос</h2><div class="row"><button class="good" data-act="save">Сохранить сейчас</button><button data-act="export">Экспорт сохранения JSON</button><label>Импорт JSON <input type="file" id="importfile" accept=".json,application/json"></label></div><p class="muted">Автосохранение включено. Данные хранятся в браузере на этом устройстве.</p><button data-act="reset">Удалить сохранение</button></section></div>`
};
function act(a,arg){let n=+arg,ev=S.event;
switch(a){
case"next":{if(S.ended)return;let income=(S.gdp*S.pop/1e6*.018+S.regions.reduce((v,r)=>v+r.industry*16,0))*difficulty().income;let upkeep=S.army*.035+S.navy*35+S.air*22;S.money+=Math.round(income-upkeep);S.food=clamp(S.food-2+(S.regions[3].industry>50?1:0));S.fuel=clamp(S.fuel-(S.army>60000?4:2));S.energy=clamp(S.energy-2);S.inflation=clamp(S.inflation+(S.money<0?2:-.2),0,50);S.stability=clamp(S.stability+(S.approval-50)*.035-(S.coupRisk>50?1:0));S.approval=clamp(S.approval+(S.employment-90)*.12-(S.inflation>15?1:0));S.regions.forEach(r=>{r.unrest=clamp(r.unrest+(50-r.loyalty)*.06+(S.food<30?2:0)-1*difficulty().unrest);r.loyalty=clamp(r.loyalty+(S.approval-50)*.025-r.unrest*.01)});S.coupRisk=clamp(70-S.stability*.55-S.morale*.18+(S.army>80000?8:0));S.month++;if(S.month>12){S.month=1;S.year++;}if(S.month%6===0)randomEvent();if(S.month===1&&S.year%2===1)S.election=Math.max(0,S.election-1);if(S.year>20){S.ended=true;log("Кампания завершена: прошло 240 месяцев.");note("Кампания завершена!");}log(`Месяц завершён. Доход: ₵${fmt(income)}, содержание армии: ₵${fmt(upkeep)}.`);break}
case"taxup":S.money+=1200;S.approval=clamp(S.approval-5);S.inflation=clamp(S.inflation+1);log("Повышены налоги.");break;
case"taxdown":S.money-=700;S.approval=clamp(S.approval+4);log("Снижены налоги.");break;
case"industry":if(spend(3500)){S.gdp+=900;S.employment=clamp(S.employment+2);S.regions[2].industry=clamp(S.regions[2].industry+8);log("Промышленность получила инвестиции.");}break;
case"research":if(spend(2800)){S.tech=clamp(S.tech+8);S.gdp+=450;log("Научная программа дала результат.");}break;
case"welfare":if(spend(2200)){S.approval=clamp(S.approval+7);S.stability=clamp(S.stability+3);S.employment=clamp(S.employment+1);log("Запущена социальная программа.");}break;
case"infrastructure":if(spend(3000)){S.regions.forEach(r=>r.infra=clamp(r.infra+4));S.gdp+=500;log("Инфраструктура улучшена.");}break;
case"import":if(spend(1800)){S.food=clamp(S.food+12);S.fuel=clamp(S.fuel+9);S.steel=clamp(S.steel+8);S.ammo=clamp(S.ammo+6);log("Импортированы стратегические ресурсы.");}break;
case"ration":S.food=clamp(S.food+7);S.fuel=clamp(S.fuel+8);S.approval=clamp(S.approval-3);log("Введён режим экономии ресурсов.");break;
case"recruit":if(spend(2400)){S.army+=5000;S.morale=clamp(S.morale-2);S.coupRisk=clamp(S.coupRisk+2);log("Призваны 5 000 военнослужащих.");}break;
case"train":if(spend(1500)&&S.fuel>=4&&S.ammo>=3){S.fuel-=4;S.ammo-=3;S.training=clamp(S.training+8);S.morale=clamp(S.morale+3);log("Проведены военные учения.");}break;
case"buyarms":if(spend(2600)){S.equipment=clamp(S.equipment+14);S.steel=clamp(S.steel-5);log("Закуплена военная техника.");}break;
case"reserve":S.army+=10000;S.approval=clamp(S.approval-2);S.threat=clamp(S.threat+5);log("Объявлен резерв.");break;
case"demobilize":S.army=Math.max(10000,S.army-10000);S.approval=clamp(S.approval+2);S.coupRisk=clamp(S.coupRisk-4);log("Часть армии демобилизована.");break;
case"mobilize":S.army+=15000;S.threat=clamp(S.threat+8);S.stability=clamp(S.stability-3);log("Проведена частичная мобилизация.");break;
case"defense":if(spend(2000)){S.threat=clamp(S.threat-8);S.equipment=clamp(S.equipment-2);log("Пограничная оборона укреплена.");}break;
case"changegov":S.gov=$("#gov").value;if(S.gov==="Военная администрация"){S.stability=clamp(S.stability+8);S.approval=clamp(S.approval-12);S.coupRisk=clamp(S.coupRisk+10)}else{S.legitimacy=clamp(S.legitimacy+5)}log("Изменена форма правления: "+S.gov);break;
case"party":{let name=$("#newparty").value.trim();if(name&&S.parties.length<8){S.parties.push({name,support:5,seats:0,ideology:"Новая партия"});log("Зарегистрирована партия "+name)}else note("Введите название (максимум 8 партий)");break}
case"law":{let laws=[["Антикоррупционная реформа",1200],["Повышение минимальной зарплаты",1800],["Независимость судов",1500],["Расширение полномочий регионов",1300],["Государственная цифровизация",2000],["Обязательная военная служба",900]];if(spend(laws[n][1])){if(n===0)S.legitimacy=clamp(S.legitimacy+9);if(n===1)S.approval=clamp(S.approval+6);if(n===2)S.stability=clamp(S.stability+5);if(n===3)S.regions.forEach(r=>r.loyalty=clamp(r.loyalty+5));if(n===4){S.gdp+=800;S.tech=clamp(S.tech+4)}if(n===5){S.army+=6000;S.approval=clamp(S.approval-4)}log("Принят закон: "+laws[n][0])}break}
case"campaign":if(spend(900)){S.approval=clamp(S.approval+5);S.legitimacy=clamp(S.legitimacy+3);log("Проведена информационная кампания.");}break;
case"cabinet":S.stability=clamp(S.stability+3);S.approval=clamp(S.approval-2);log("Правительство переформировано.");break;
case"region":if(spend(1200)){let r=S.regions[n];r.wealth=clamp(r.wealth+8);r.infra=clamp(r.infra+5);r.loyalty=clamp(r.loyalty+6);r.unrest=clamp(r.unrest-5);log("Инвестиции направлены в регион "+r.name)}break;
case"police":{let r=S.regions[n];r.unrest=clamp(r.unrest-12);r.loyalty=clamp(r.loyalty-2);log("В регионе "+r.name+" восстановлен порядок.");break}
case"diplomat":if(spend(700)){S.relations[n].value=clamp(S.relations[n].value+15,-100,100);S.threat=clamp(S.threat-2);log("Проведены переговоры с "+S.relations[n].name)}break;
case"trade":if(spend(500)){S.money+=1800;S.food=clamp(S.food+5);S.relations[1].value=clamp(S.relations[1].value+8,-100,100);log("Заключено торговое соглашение.");}break;
case"alliance":if(S.relations[1].value>30){S.relations[1].value=clamp(S.relations[1].value+15,-100,100);S.threat=clamp(S.threat-7);log("Союзное соглашение согласовано.")}else note("Сначала улучшите отношения с Белорией");break;
case"peace":S.threat=clamp(S.threat-12);S.stability=clamp(S.stability+2);log("Мирная инициатива снизила напряжённость.");break;
case"intel":S.threat=clamp(S.threat-4);S.coupRisk=clamp(S.coupRisk-3);log("Разведка обновила оценку рисков.");break;
case"counter":if(spend(1600)){S.coupRisk=clamp(S.coupRisk-14);S.stability=clamp(S.stability+3);log("Усилен гражданский контроль над силовыми структурами.");}break;
case"coup":if(Math.random()*100<S.coupRisk){S.gov="Переходное правительство";S.leader="Совет национального спасения";S.legitimacy=clamp(S.legitimacy-25);S.stability=clamp(S.stability-20);S.money=Math.max(0,S.money-2500);S.coupRisk=20;log("Попытка переворота удалась. Сформировано переходное правительство.");}else{S.coupRisk=clamp(S.coupRisk-15);S.stability=clamp(S.stability+3);log("Попытка переворота предотвращена.");}break;
case"trigger":randomEvent(true);break;
case"event":if(ev){let o=ev.options[n];Object.entries(o.effect).forEach(([k,v])=>{if(k==="money")S.money+=v;else if(k==="approval"||k==="stability"||k==="food")S[k]=clamp(S[k]+v);else if(k==="region")S.regions[2].unrest=clamp(S.regions[2].unrest+v)});log("Решение по событию: "+o.label);S.event=null;}break;
case"election":S.parties.sort((a,b)=>b.support-a.support);S.party=S.parties[0].name;S.leader="Новый избранный руководитель";S.legitimacy=clamp(S.legitimacy+10);S.approval=clamp(S.approval+3);log("Проведены выборы. Победила партия "+S.party);break;
case"document":{let title=$("#doctitle").value.trim()||"Документ без названия";S.documents.unshift({type:$("#doctype").value,title,body:$("#docbody").value,month:S.month,year:S.year});log("Создан документ: "+title);note("Документ добавлен в архив.");break}
case"viewdoc":{let d=S.documents[n];alert(`${d.type}\n${d.title}\n\n${d.body||"(без текста)"}`);return}
case"exportdocs":download("novaria-documents.json",JSON.stringify(S.documents,null,2));return;
case"difficulty":S.difficulty=$("#difficulty").value;log("Установлена сложность: "+difficulty().label);break;
case"save":save();note("Сохранение выполнено.");break;
case"export":download("novaria-save.json",JSON.stringify(S,null,2));return;
case"new":if(confirm("Начать новую кампанию? Текущий прогресс будет заменён.")){S=defaults();S.difficulty=$("#difficulty").value||"normal";log("Начата новая кампания.");}break;
case"reset":if(confirm("Удалить сохранение и начать заново?")){localStorage.removeItem("novariaSave");S=defaults();}break;
}
render();}
function randomEvent(force=false){if(S.event&&!force)return;let events=[{title:"Забастовка работников",text:"Профсоюзы требуют улучшить условия труда.",options:[{label:"Выделить средства (₵1200)",effect:{money:-1200,approval:5,stability:2}},{label:"Отказать",effect:{approval:-6,stability:-3,region:8}}]},{title:"Энергетический кризис",text:"Снижение поставок угрожает промышленности.",options:[{label:"Закупить топливо",effect:{money:-900,food:0,stability:2}},{label:"Ввести ограничения",effect:{approval:-4,stability:-1}}]},{title:"Антикоррупционное расследование",text:"Журналисты обнаружили подозрительные контракты.",options:[{label:"Начать открытое расследование",effect:{approval:5,stability:2}},{label:"Замять дело",effect:{legitimacy:-7,stability:-3}}]}];let e=events[Math.floor(Math.random()*events.length)];S.event=e;log("Событие: "+e.title);if(force)note("Новое событие появилось во вкладке «События».")}
function download(name,data){let a=document.createElement("a"),u=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
$("#tabs").onclick=e=>{let b=e.target.closest("button[data-tab]");if(b){tab=b.dataset.tab;render()}};
document.addEventListener("change",e=>{if(e.target.id==="importfile"){let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{S=JSON.parse(rd.result);render();note("Сохранение импортировано")}catch{note("Некорректный JSON")}};rd.readAsText(f)}});
render();
</script></body></html>
