<style>
:root{--bg:#101722;--panel:#192536;--panel2:#213249;--line:#344960;--txt:#edf4fb;--muted:#a9bacb;--gold:#f0bd58;--green:#55c58a;--red:#ef6d72;--blue:#69aef2}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#0c1420,#142337);color:var(--txt);font:15px system-ui,Segoe UI,sans-serif}

.bar{height:9px;background:#0d1723;border-radius:20px;overflow:hidden;margin:5px 0 10px}.bar i{display:block;height:100%;background:var(--green)}.meter{min-width:110px;flex:1}.meter b{font-size:13px}

.cardlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}.mini{background:#122033;border:1px solid var(--line);border-radius:10px;padding:10px}.mini b{display:block;margin-bottom:5px}.log{max-height:240px;overflow:auto;font-size:13px;color:var(--muted)}.log div{padding:6px 0;border-bottom:1px solid #34496066}

.hidden{display:none!important}.choice{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px;border-bottom:1px solid var(--line)}.choice:last-child{border:0}
