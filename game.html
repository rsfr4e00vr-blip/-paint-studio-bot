<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Новария — стратегия государства</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/style.css?v=2"><link rel="stylesheet" href="/nations.css"><link rel="stylesheet" href="/interface-v4.css"><link rel="stylesheet" href="/hoi4-clean-interface.css"><link rel="stylesheet" href="/nav-fix.css?v=13"><link rel="stylesheet" href="/charts.css?v=1">
</head><body>
<header><div class="emblem" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#d6b25e" stroke-width="1.8"><path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"/><path d="M12 8v8M8 12h8"/></svg></div><div><h1>Республика Новария</h1><p id="subtitle">Стройте державу · развивайте экономику · меняйте ход истории</p></div></header>
<main>
<section class="timebar"><div class="time-now" id="clock">Год 1 · Январь</div><button id="play" class="good">▶ Играть</button><button id="pause">⏸ Пауза</button><button id="stop" class="danger">⏹ Стоп</button><button id="step" class="primary">+ 1 месяц</button><label>Скорость</label><select id="speed"><option value="3000">0.5×</option><option value="1800" selected>1×</option><option value="900">2×</option><option value="400">5×</option><option value="150">10×</option><option value="50">30×</option></select><span class="pill" id="runstate">Пауза</span></section>
<div class="topline" id="stats"></div>
<nav class="tabbar" id="tabs" aria-label="Главное меню">
<div class="cats"><button data-cat="ov" data-tab="overview" class="on">⌂ Обзор</button><button data-cat="map" data-tab="map">🗺 Карта</button><button data-cat="eco" data-tab="economy">💰 Экономика</button><button data-cat="army" data-tab="military">⚔ Армия</button><button data-cat="state" data-tab="politics">🏛 Власть</button><button data-cat="dip" data-tab="diplomacy">🌐 Мир</button><button data-cat="dev" data-tab="research">🔬 Развитие</button></div>
<div class="subs">
<div class="sub" data-cat="eco" hidden><button data-tab="economy">Всё по экономике</button><button data-tab="regions">Регионы</button><button data-tab="charts">Графики</button></div>
<div class="sub" data-cat="state" hidden><button data-tab="politics">Власть и законы</button><button data-tab="deputies">Парламент</button><button data-tab="documents">Документы</button><button data-tab="comeback">Возврат</button></div>
<div class="sub" data-cat="dip" hidden><button data-tab="diplomacy">Страны и вассалы</button><button data-tab="worldtension">Напряжённость</button></div>
<div class="sub" data-cat="dev" hidden><button data-tab="research">Наука</button><button data-tab="focus">Цели</button><button data-tab="settings">⚙ Настройки</button></div>
</div></nav>
<div id="content"></div></main><div class="notice" id="notice"></div>
<script src="/world.js"></script><script src="/regions.js"></script><script src="/world_data.js"></script><script src="/fx.js?v=1"></script><script src="/resources.js"></script><script src="/nn_core.js?v=1"></script><script src="/ai_arsenal.js?v=3"></script><script src="/ai_nations.js?v=3"></script><script src="/population_ai.js?v=1"></script><script src="/game.js?v=18"></script><script src="/nations.js?v=9"></script><script>(function(){var t=document.getElementById('tabs');if(!t)return;
function show(c){t.querySelectorAll('.cats button').forEach(function(b){b.classList.toggle('on',b.dataset.cat===c)});t.querySelectorAll('.sub').forEach(function(s){s.hidden=s.dataset.cat!==c})}
/* вкладки, которые теперь слиты внутрь больших страниц */
var HUB={finance:'eco',market:'eco',industry:'eco',resources:'eco',staff:'army',arms:'army',power:'state',bills:'state',advisors:'state',people:'state'};
function catOf(tab){if(HUB[tab])return HUB[tab];var b=t.querySelector('[data-tab="'+tab+'"]');if(!b)return null;var s=b.closest('.sub');return s?s.dataset.cat:b.dataset.cat}
t.addEventListener('click',function(e){var b=e.target.closest('[data-tab]');if(b){var c=b.closest('.sub')?b.closest('.sub').dataset.cat:b.dataset.cat;show(c)}});
setInterval(function(){try{var cur=window.NG&&NG.getTab&&NG.getTab();var c=cur&&catOf(cur);if(c){show(c)}}catch(_){}},500);
})();</script></body></html>
