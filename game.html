['Ничего не делать','↓ рейтинг',{app:-2}]]],

['Жёсткий карантин','↓ рост, смертность ↓',{g:-1,app:-1,dt:-.7}],

['Не вмешиваться','↓↓ рейтинг, ↑ смертность',{app:-5,dt:1}]]],

['Допустить банкротства','↓ рост, ↑ безработица',{g:-1.5,u:1.5,app:-2},[8,{I:1.5},'Очищенный банковский сектор привлёк капитал.','ok']]]]];
const H={gdp:'Номинальный ВВП: всё, что производит экономика за год, в млрд.',pc:'ВВП на душу населения: рост показывает, богатеет ли население.',g:'Реальный рост ВВП в год. Растёт от инвестиций, инфраструктуры, образования и падает от коррупции и налогов.',inf:'Инфляция: рост цен. Растёт от слабой валюты и дефицита; ключевая ставка её сбивает.',u:'Безработица. Растёт при рецессии и притоке населения, падает при росте и инвестициях.',d:'Госдолг к ВВП. Выше 90% — проценты съедают бюджет, выше 150% — дефолт.',def:'Дефицит бюджета в годовом выражении, % ВВП. Покрывается резервами, затем долгом.',res:'Резервы: покрывают дефицит бюджета и пополняются торговым профицитом.',fx:'Курс иностранной валюты (100 = старт). Рост — ослабление нашей валюты: экспорт дешевле, импорт дороже.',cor:'Коррупция. Крадёт доходы бюджета, снижает эффективность расходов, инвестиции, рост и рейтинг. ≥90% — захват государства.',eff:'Какая доля бюджетных расходов реально доходит до результата. При коррупции 35% = 100%.',tb:'Торговый баланс: экспорт минус импорт, % ВВП. Профицит укрепляет валюту и копит резервы.',ex:'Экспорт, % ВВП. Зависит от цен на сырьё и курса (слабая валюта помогает).',im:'Импорт, % ВВП. Растёт вместе с экономикой, дешевеет при слабой валюте.',oil:'Мировые цены на сырьё и энергию (100 = норма). Главный внешний шок для экспорта.',pop:'Население, млн. Определяется рождаемостью, смертностью и миграцией.',br:'Рождаемость на 1000 чел. Растёт от поддержки семей, здравоохранения и низкой безработицы.',dt:'Смертность на 1000 чел. Зависит от здравоохранения и доли пожилых.',mig:'Чистая миграция на 1000 чел. Привлекают рост, высокий рейтинг и низкая коррупция.',old:'Доля пожилых. Чем больше — тем дороже пенсии и выше смертность.',need:'Расходы на пенсии, нужные для текущей доли пожилых. Если ставка ниже — падают рейтинг и рождаемость.',I:'Частные инвестиции, % ВВП. Растут при низких налогах, ставке, коррупции и высоком рейтинге.',gI:'Госинвестиции: расходы на инфраструктуру с поправкой let tipT;function tip(k){const t=$('#tip');if(t.dataset.k===k&&t.style.display==='block'){t.style.display='none';return}t.dataset.k=k;t.innerHTML=H[k]||'';t.style.display='block';clearTimeout(tipT);tipT=setTimeout(()=>t.style.display='none',7000)}
function step(){
if(S.over||S.ev!=null)return;const s=S,sp=s.sp,sum=Object.values(sp).reduce((a,b)=>a+b,0),e=eff();
const rev=s.gdp/12*(.5*s.inc/100*(1-s.u/100)+.25*s.corp/100+.33*s.vat/100)*(1-.0025*(s.cor-35)),spend=s.gdp/12*sum/100,int=s.debt*(s.rate*.6+1)/1200,bal=rev-spend-int;

if(bal<0){const t=Math.min(s.res,-bal);s.res-=t;s.debt+=-bal-t}else{s.res+=bal*.5;s.debt=Math.max(0,s.debt-bal*.5)}

// инвестиции, сырьё, торговля
s.I=cl(s.I+.12*(20-.2*(s.corp-20)-.08*(s.inc-15)-.5*(real-2)+.06*(s.app-55)-.1*(s.cor-35)+.04*(s.ix.inf-50)-s.I),4,40);
s.oil=cl(s.oil+.02*(100-s.oil)+(Math.random()+Math.random()+Math.random()-1.5)*5,30,220);
const X=.22*(.5+.5*s.oil/100)*Math.pow(s.fx/100,.4)*(1-.002*(s.cor-35)),M=.2*(1+.015*(s.g-2.6))*Math.pow(100/s.fx,.3);s.ex=X*100;s.im=M*100;s.tb=(X-M)*100;
// макро
const tg2=2.6+.025*(s.ix.inf-50)+.022*(s.ix.edu-50)+.1*(s.I-20)-.05*(s.corp-20)-.05*(s.inc-15)-.05*(s.vat-20)-.06*(real-2)+.12*(def-3)-.05*Math.max(0,D-60)-.03*(s.cor-35)+.3*(popg-.2)+.05*(s.tb-2);
s.g=cl(pg*.7+(tg2>2.6?2.6+(tg2-2.6)*.55:tg2)*.3,-12,12);
s.inf=cl(pi+.05*(s.g-2.6)-.06*(real-1.5)+.04*(def-3)+.1*(3-pi),0,60);
s.u=cl(pu-.05*(s.g-2.5)+.01*(6.5-pu)+.005*(real-2)+.04*(popg-.2)-.01*(s.I-20),2,35);
s.ix.inf=cl(s.ix.inf+(sp.inf*e-2.5)*1.2-.3,0,100);s.ix.edu=cl(s.ix.edu+(sp.edu*e-3.5)-.1,0,100);s.ix.hlt=cl(s.ix.hlt+(sp.hlt*e-3.5)-.1,0,100);

s.dt=cl(s.dt+.05*(10.5-.03*(s.ix.hlt-50)+.12*(s.old-18)+.1*Math.max(0,s.u-15)-s.dt),6,25);
s.mig=cl(s.mig+.1*(.05*(s.app-55)+.25*(s.g-2.6)-.1*(s.u-6.5)-.03*(s.cor-35)+.03*(s.ix.edu-50)-s.mig),-10,10);

const tar=55-1.4*(s.inf-3)-1.6*(s.u-6.5)+.5*(s.g-2.5)+.15*(s.ix.hlt-50)+.1*(s.ix.edu-50)-.5*(s.inc-15)-.35*(s.vat-20)-.06*(s.corp-20)+.6*(sp.soc-need())-.1*Math.max(0,D-60)-.12*(s.cor-35);
s.app=cl(s.app+.18*(tar-s.app),0,100);
s.m++;s.hist.push(cur());if(s.hist.length>240)s.hist.shift();
